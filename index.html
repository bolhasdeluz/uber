      if (!decimalHours || decimalHours <= 0) return "0 h 0 m";
      const totalMinutes = Math.round(decimalHours * 60);
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      return `${h} h ${m} m`;

    const recoverAllShifts = () => {
      const keys = ["rota_shifts_master", "rota_shifts_v4", "rota_shifts_v3", "rota_shifts_v2", "rota_shifts"];
      let combined = [...baseHistoricalShifts];
      const seen = new Set(combined.map(s => `${s.date}_${s.income}`));

      keys.forEach(k => {
        try {
          const raw = localStorage.getItem(k);
          if (raw) {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr)) {
              arr.forEach(item => {
                const key = `${item.date}_${item.income}`;
                if (!seen.has(key)) {
                  seen.add(key);
                  combined.push({ allocations: {}, ...item });
                }
              });
            }
          }
        } catch(e) {}
      });

      return combined.sort((a, b) => b.date.localeCompare(a.date));
    };

    function App() {
      const [wallet, setWallet] = useState(() => {
        const saved = localStorage.getItem("rota_wallet_master");
        if (saved) return JSON.parse(saved);
        const oldWallet = localStorage.getItem("rota_wallet_v4") || localStorage.getItem("rota_wallet");
        return oldWallet ? JSON.parse(oldWallet) : 51.17;
      });

      const [shifts, setShifts] = useState(() => recoverAllShifts());

      const [expenses, setExpenses] = useState(() => {
        const saved = localStorage.getItem("rota_expenses_master");
        if (saved) return JSON.parse(saved);
        const old = localStorage.getItem("rota_expenses_v4") || localStorage.getItem("rota_expenses");
        return old ? JSON.parse(old) : [];
      });

      const [debts, setDebts] = useState(() => {
        const saved = localStorage.getItem("rota_debts_master");
        if (saved) return JSON.parse(saved);
        const old = localStorage.getItem("rota_debts_v3") || localStorage.getItem("rota_debts_v2");
        return old ? JSON.parse(old) : initialDebtsList;
      });

      const [groups, setGroups] = useState(() => {
        const saved = localStorage.getItem("rota_groups_master");
        return saved ? JSON.parse(saved) : initialGroupsList;
      });

      const [weeklyGoal, setWeeklyGoal] = useState(() => {
        const saved = localStorage.getItem("rota_goal");
        return saved ? parseFloat(saved) : 800;
      });

      const [monthlyIncome, setMonthlyIncome] = useState(() => {
        const saved = localStorage.getItem("rota_income_master");
        return saved ? parseFloat(saved) : 7000;
      });

      const [fixedExpenseGroups, setFixedExpenseGroups] = useState(() => {
        const saved = localStorage.getItem("rota_income_groups_master");
        return saved ? JSON.parse(saved) : [];
      });

      const [fixedExpenses, setFixedExpenses] = useState(() => {
        const saved = localStorage.getItem("rota_income_expenses_master");
        return saved ? JSON.parse(saved) : [];
      });

      const [weekOffset, setWeekOffset] = useState(0);
      const [selectedDayIndex, setSelectedDayIndex] = useState(null);

      // Modais
      const [isShiftModalOpen, setIsShiftModalOpen] = useState(false);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      const [isDebtsListModalOpen, setIsDebtsListModalOpen] = useState(false);
      const [isDebtEditModalOpen, setIsDebtEditModalOpen] = useState(false);
      const [isGroupsModalOpen, setIsGroupsModalOpen] = useState(false);
      const [isTrashModalOpen, setIsTrashModalOpen] = useState(false);
      const [isInstallmentCalendarOpen, setIsInstallmentCalendarOpen] = useState(false);
      const [isIncomeModalOpen, setIsIncomeModalOpen] = useState(false);
      const [isIncomeEditModalOpen, setIsIncomeEditModalOpen] = useState(false);
      const [incomeEditValue, setIncomeEditValue] = useState("");
      const [isFixedExpenseGroupsModalOpen, setIsFixedExpenseGroupsModalOpen] = useState(false);
      const [isFixedExpenseFormModalOpen, setIsFixedExpenseFormModalOpen] = useState(false);
      const [editingFixedExpenseId, setEditingFixedExpenseId] = useState(null);
      const [fixedExpenseForm, setFixedExpenseForm] = useState({ name: "", value: "", groupId: "" });
      const [editingFixedExpenseGroupId, setEditingFixedExpenseGroupId] = useState(null);
      const [fixedExpenseGroupForm, setFixedExpenseGroupForm] = useState({ name: "" });
      const [collapsedFixedExpenseGroups, setCollapsedFixedExpenseGroups] = useState({});
      const [isWalletEditModalOpen, setIsWalletEditModalOpen] = useState(false);
      const [isMonthlyModalOpen, setIsMonthlyModalOpen] = useState(false);
      const [isDayDetailModalOpen, setIsDayDetailModalOpen] = useState(false);
      const [selectedMonthKey, setSelectedMonthKey] = useState(null);
      const [isPartialPayModalOpen, setIsPartialPayModalOpen] = useState(false);
      const [payingDebtId, setPayingDebtId] = useState(null);
      const [partialPayValue, setPartialPayValue] = useState("");
      const [isBackupModalOpen, setIsBackupModalOpen] = useState(false);
      const importFileInputRef = useRef(null);

      // Edições
      const [editingShiftId, setEditingShiftId] = useState(null);
      const [editingExpenseId, setEditingExpenseId] = useState(null);
      const [editingDebtId, setEditingDebtId] = useState(null);
      const [editingGroupId, setEditingGroupId] = useState(null);
      const [collapsedGroups, setCollapsedGroups] = useState({});

      const [shiftForm, setShiftForm] = useState({
        date: getTodayLocalDate(),
        platform: "uber",
        income: "",
        hours: "",
        km: "",
        trips: "",
      });

      const [expenseForm, setExpenseForm] = useState({ amount: "", description: "", date: getTodayLocalDate() });
      const [debtForm, setDebtForm] = useState({
        name: "",
        target: "",
        groupId: "",
        isInstallment: false,
        installmentTotal: "",
        installmentValue: "",
        installmentFirstDue: getTodayLocalDate(),
      });
      const [groupForm, setGroupForm] = useState({ name: "" });
      const [walletEditValue, setWalletEditValue] = useState("");

      useEffect(() => {
        localStorage.setItem("rota_wallet_master", JSON.stringify(wallet));
        localStorage.setItem("rota_shifts_master", JSON.stringify(shifts));
        localStorage.setItem("rota_expenses_master", JSON.stringify(expenses));
        localStorage.setItem("rota_debts_master", JSON.stringify(debts));
        localStorage.setItem("rota_groups_master", JSON.stringify(groups));
        localStorage.setItem("rota_goal", weeklyGoal.toString());
        localStorage.setItem("rota_income_master", monthlyIncome.toString());
        localStorage.setItem("rota_income_groups_master", JSON.stringify(fixedExpenseGroups));
        localStorage.setItem("rota_income_expenses_master", JSON.stringify(fixedExpenses));
        if (window.lucide) window.lucide.createIcons();
      }, [wallet, shifts, expenses, debts, groups, weeklyGoal, monthlyIncome, fixedExpenseGroups, fixedExpenses]);

      // Correção pontual: restaura/atualiza a lista completa de metas (Casa, Terreiro, Dívidas)
      // com os valores corretos, sem apagar o que já foi pago nem duplicar metas existentes.
      useEffect(() => {
        const MIGRATION_KEY = "rota_metas_restore_2026_09";
        if (localStorage.getItem(MIGRATION_KEY)) return;
        localStorage.setItem(MIGRATION_KEY, "1");

        const groupDefs = [
          { name: "Casa", fallbackId: 900001 },
          { name: "Terreiro", fallbackId: 900002 },
          { name: "Dívidas", fallbackId: 900003 },
        ];
        const resolvedGroupIds = {};
        groupDefs.forEach(gd => {
          const existing = groups.find(g => g.name.trim().toLowerCase() === gd.name.toLowerCase());
          resolvedGroupIds[gd.name] = existing ? existing.id : gd.fallbackId;
        });

        setGroups(prev => {
          const next = [...prev];
          groupDefs.forEach(gd => {
            if (!next.some(g => g.id === resolvedGroupIds[gd.name])) {
              next.push({ id: resolvedGroupIds[gd.name], name: gd.name });
            }
          });
          return next;
        });

        const canonicalDebts = [
          { id: 101, name: "Luz", target: 95.00, group: "Terreiro" },
          { id: 102, name: "Água", target: 40.00, group: "Terreiro" },
          { id: 103, name: "Internet", target: 130.00, group: "Terreiro" },
          { id: 104, name: "Alarme", target: 200.00, group: "Terreiro" },
          { id: 105, name: "Aluguel", target: 1000.00, group: "Terreiro" },
          { id: 106, name: "Fernanda", target: 200.00, group: "Terreiro" },
          { id: 107, name: "Tassiana", target: 190.00, group: "Terreiro" },
          { id: 108, name: "Everson", target: 300.00, group: "Terreiro" },
          { id: 109, name: "Facio", target: 497.84, group: "Dívidas" },
          { id: 110, name: "Blipay", target: 232.98, group: "Dívidas" },
          { id: 111, name: "iFood", target: 380.49, group: "Dívidas" },
          { id: 112, name: "Infinity", target: 353.43, group: "Dívidas" },
          { id: 113, name: "Inter", target: 300.49, group: "Dívidas" },
          { id: 201, name: "Luz", target: 380.00, group: "Casa" },
          { id: 202, name: "Gás", target: 200.00, group: "Casa" },
          { id: 203, name: "Internet (Claro)", target: 155.00, group: "Casa" },
          { id: 204, name: "Vivo", target: 190.00, group: "Casa" },
          { id: 205, name: "Psico", target: 250.00, group: "Casa" },
          { id: 206, name: "Psiquiatra", target: 250.00, group: "Casa" },
          { id: 207, name: "Ração/Bagão", target: 330.00, group: "Casa" },
          { id: 208, name: "Petlove", target: 230.00, group: "Casa" },
          { id: 209, name: "Unha", target: 160.00, group: "Casa" },
          { id: 210, name: "Murilo", target: 60.00, group: "Casa" },
          { id: 211, name: "iCloud", target: 67.00, group: "Casa" },
          { id: 212, name: "Claude", target: 110.00, group: "Casa" },
          { id: 213, name: "BB", target: 57.00, group: "Casa" },
          { id: 216, name: "Gabriela", target: 426.00, group: "Casa" },
          { id: 217, name: "Stephanie", target: 250.00, group: "Casa" },
          { id: 218, name: "Ferragem", target: 353.00, group: "Casa" },
        ];

        setDebts(prev => {
          const next = [...prev];
          canonicalDebts.forEach(item => {
            const idx = next.findIndex(d => d.id === item.id);
            const groupId = resolvedGroupIds[item.group];
            if (idx >= 0) {
              next[idx] = { ...next[idx], name: item.name, target: item.target, groupId, deletedAt: null };
            } else {
              next.push({ id: item.id, name: item.name, target: item.target, current: 0, groupId, deletedAt: null });
            }
          });
          return next;
        });
      }, []);

      // Métricas da Semana (Painel Uber + Meta de 800)
      const weekData = useMemo(() => {
        const now = new Date();
        const currentDay = now.getDay() === 0 ? 7 : now.getDay();

        const monday = new Date(now);
        monday.setDate(now.getDate() - (currentDay - 1) + weekOffset * 7);
        monday.setHours(0, 0, 0, 0);

        const days = [];
        const dayNames = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];
        const monthNames = ["jan.", "fev.", "mar.", "abr.", "mai.", "jun.", "jul.", "ago.", "set.", "out.", "nov.", "dez."];

        for (let i = 0; i < 7; i++) {
          const d = new Date(monday);
          d.setDate(monday.getDate() + i);
          
          const localISO = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split("T")[0];
          const dayShifts = shifts.filter(s => s.date === localISO);
          const dayExpenses = expenses.filter(e => e.date === localISO);

          const income = dayShifts.reduce((acc, s) => acc + s.income, 0);
          const hours = dayShifts.reduce((acc, s) => acc + s.hours, 0);
          const km = dayShifts.reduce((acc, s) => acc + s.km, 0);
          const trips = dayShifts.reduce((acc, s) => acc + s.trips, 0);

          days.push({
            dateStr: localISO,
            dayNum: d.getDate(),
            monthName: monthNames[d.getMonth()],
            dayName: dayNames[i],
            income,
            hours,
            km,
            trips,
            shiftsList: dayShifts,
            expensesList: dayExpenses,
            hasWork: dayShifts.length > 0
          });
        }

        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);

        const dateRangeLabel = `${monday.getDate()} de ${monthNames[monday.getMonth()]} – ${sunday.getDate()} de ${monthNames[sunday.getMonth()]}`;

        const totalIncome = days.reduce((acc, d) => acc + d.income, 0);
        const totalHours = days.reduce((acc, d) => acc + d.hours, 0);
        const totalKm = days.reduce((acc, d) => acc + d.km, 0);
        const totalTrips = days.reduce((acc, d) => acc + d.trips, 0);

        const startISO = new Date(monday.getTime() - monday.getTimezoneOffset() * 60000).toISOString().split("T")[0];
        const endISO = new Date(sunday.getTime() - sunday.getTimezoneOffset() * 60000).toISOString().split("T")[0];
        const weekExpenses = expenses.filter(e => e.date >= startISO && e.date <= endISO);
        const maxDailyIncome = Math.max(...days.map(d => d.income), 0);

        const daysLeft = weekOffset === 0 ? Math.max(1, 7 - currentDay + 1) : 7;
        const remainingGoal = Math.max(0, weeklyGoal - totalIncome);
        const dailyNeeded = daysLeft > 0 ? (remainingGoal / daysLeft) : 0;
        const goalPercent = Math.min(100, Math.round((totalIncome / weeklyGoal) * 100));

        return {
          days,
          dateRangeLabel,
          totalIncome,
          totalHours,
          totalKm,
          totalTrips,
          weekExpenses,
          maxDailyIncome,
          daysLeft,
          remainingGoal,
          dailyNeeded,
          goalPercent
        };
      }, [shifts, expenses, weekOffset, weeklyGoal]);

      // Metas ativas (exclui as que estão na lixeira) e metas na lixeira
      const activeDebts = useMemo(() => debts.filter(d => !d.deletedAt), [debts]);
      const trashedDebts = useMemo(
        () => debts.filter(d => d.deletedAt).sort((a, b) => b.deletedAt - a.deletedAt),
        [debts]
      );

      // Totais da Trilha
      const debtTotals = useMemo(() => {
        const totalTarget = activeDebts.reduce((acc, d) => acc + d.target, 0);
        const totalPaid = activeDebts.reduce((acc, d) => acc + d.current, 0);
        const allCompleted = activeDebts.length > 0 && activeDebts.every(d => d.current >= d.target);
        const percent = totalTarget > 0 ? Math.min(100, Math.round((totalPaid / totalTarget) * 100)) : 100;
        const totalRemaining = Math.max(0, totalTarget - totalPaid);
        return { totalTarget, totalPaid, totalRemaining, allCompleted, percent };
      }, [activeDebts]);

      // Metas organizadas por Grupo (metas menores dentro de cada grupo)
      // Calendário de parcelas: quanto vence em cada mês, olhando as metas parceladas
      const installmentScheduleByMonth = useMemo(() => {
        const monthMap = {};

        activeDebts.forEach(debt => {
          if (!debt.installments) return;
          const { total, value, firstDueDate } = debt.installments;
          if (!total || !value || !firstDueDate) return;

          const paidCount = Math.min(total, Math.round(debt.current / value));
          const [fy, fm, fd] = firstDueDate.split("-").map(Number);

          for (let i = paidCount; i < total; i++) {
            const dueDate = new Date(fy, fm - 1 + i, fd || 1);
            const key = `${dueDate.getFullYear()}-${String(dueDate.getMonth() + 1).padStart(2, "0")}`;
            if (!monthMap[key]) monthMap[key] = { total: 0, items: [] };
            monthMap[key].total += value;
            monthMap[key].items.push({
              debtId: debt.id,
              name: debt.name,
              value,
              installmentNumber: i + 1,
              totalInstallments: total
            });
          }
        });

        return Object.entries(monthMap)
          .map(([key, vals]) => {
            const [year, month] = key.split("-").map(Number);
            return { key, label: `${MONTH_FULL_NAMES[month - 1]} de ${year}`, ...vals };
          })
          .sort((a, b) => a.key.localeCompare(b.key));
      }, [activeDebts]);

      // Renda: total de contas fixas, saldo restante e agrupamento por categoria
      const totalFixedExpenses = useMemo(
        () => fixedExpenses.reduce((acc, e) => acc + e.value, 0),
        [fixedExpenses]
      );
      const incomeBalance = monthlyIncome - totalFixedExpenses;

      const fixedExpenseGroupsView = useMemo(() => {
        const knownGroupIds = new Set(fixedExpenseGroups.map(g => g.id));

        const sections = fixedExpenseGroups.map(g => {
          const items = fixedExpenses.filter(e => e.groupId === g.id);
          const total = items.reduce((acc, e) => acc + e.value, 0);
          return { ...g, items, total };
        });

        const ungrouped = fixedExpenses.filter(e => !knownGroupIds.has(e.groupId));
        if (ungrouped.length > 0) {
          sections.push({
            id: "ungrouped",
            name: "Sem Categoria",
            items: ungrouped,
            total: ungrouped.reduce((acc, e) => acc + e.value, 0),
            isUngrouped: true
          });
        }

        return sections;
      }, [fixedExpenseGroups, fixedExpenses]);

      const debtGroupsView = useMemo(() => {
        const knownGroupIds = new Set(groups.map(g => g.id));
        const sortDebts = (list) =>
          [...list].sort((a, b) => {
            const aDone = a.current >= a.target;
            const bDone = b.current >= b.target;
            if (aDone !== bDone) return aDone ? 1 : -1;
            return 0;
          });

        const buildSection = (base, groupDebts) => {
          const target = groupDebts.reduce((acc, d) => acc + d.target, 0);
          const paid = groupDebts.reduce((acc, d) => acc + Math.min(d.current, d.target), 0);
          const percent = target > 0 ? Math.min(100, Math.round((paid / target) * 100)) : 0;
          const completedCount = groupDebts.filter(d => d.current >= d.target).length;
          return { ...base, debts: groupDebts, target, paid, percent, completedCount };
        };

        const sections = groups.map(g => buildSection(g, sortDebts(activeDebts.filter(d => d.groupId === g.id))));

        const ungrouped = sortDebts(activeDebts.filter(d => !knownGroupIds.has(d.groupId)));
        if (ungrouped.length > 0) {
          sections.push(buildSection({ id: "ungrouped", name: "Sem Grupo", isUngrouped: true }, ungrouped));
        }

        return sections;
      }, [groups, activeDebts]);

      const toggleGroupCollapse = (id) => {
        setCollapsedGroups(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const activeStats = useMemo(() => {
        if (selectedDayIndex !== null && weekData.days[selectedDayIndex]) {
          const d = weekData.days[selectedDayIndex];
          return {
            title: `${d.dayNum} de ${d.monthName} (${d.dayName})`,
            income: d.income,
            hours: d.hours,
            trips: d.trips,
            km: d.km,
            shiftsList: d.shiftsList,
            expensesList: d.expensesList,
            isSingleDay: true
          };
        }
        return {
          title: "Total da Semana",
          income: weekData.totalIncome,
          hours: weekData.totalHours,
          trips: weekData.totalTrips,
          km: weekData.totalKm,
          shiftsList: [],
          expensesList: weekData.weekExpenses,
          isSingleDay: false
        };
      }, [selectedDayIndex, weekData]);

      // Média de ganhos por hora em cada plataforma (Uber x 99), na semana em exibição
      const platformStats = useMemo(() => {
        const weekShifts = weekData.days.flatMap(d => d.shiftsList);

        const buildPlatformStat = (platformKey) => {
          const platformShifts = weekShifts.filter(s => (s.platform || "uber") === platformKey);
          const income = platformShifts.reduce((acc, s) => acc + s.income, 0);
          const hours = platformShifts.reduce((acc, s) => acc + s.hours, 0);
          const perHour = hours > 0 ? income / hours : 0;
          return { income, hours, perHour, count: platformShifts.length };
        };

        return {
          uber: buildPlatformStat("uber"),
          "99": buildPlatformStat("99"),
          hasAnyData: weekShifts.length > 0
        };
      }, [weekData]);

      // Salvar Turno com rastreio de alocação
      const handleSaveShift = (e) => {
        e.preventDefault();
        const income = parseFloat(shiftForm.income) || 0;
        const hours = parseFloat(shiftForm.hours) || 0;
        const km = parseFloat(shiftForm.km) || 0;
        const trips = parseInt(shiftForm.trips) || 0;

        if (income <= 0) return;

        if (editingShiftId) {
          const oldShift = shifts.find(s => s.id === editingShiftId);
          const diffIncome = income - (oldShift ? oldShift.income : 0);
          setShifts(prev => prev.map(s => (s.id === editingShiftId ? { ...s, date: shiftForm.date, platform: shiftForm.platform, income, hours, km, trips } : s)));
          setWallet(prev => Math.max(0, prev + diffIncome));
        } else {
          setShifts([{ id: Date.now(), date: shiftForm.date, platform: shiftForm.platform, income, hours, km, trips, allocations: {} }, ...shifts]);
          setWallet(prev => Math.max(0, prev + income));
        }

        setIsShiftModalOpen(false);
        setEditingShiftId(null);
        setShiftForm({
          date: getTodayLocalDate(),
          platform: "uber",
          income: "",
          hours: "",
          km: "",
          trips: "",
        });
      };

      const handleOpenEditShift = (shift) => {
        setEditingShiftId(shift.id);
        setShiftForm({
          date: shift.date,
          platform: shift.platform || "uber",
          income: shift.income.toString(),
          hours: shift.hours ? shift.hours.toString() : "",
          km: shift.km ? shift.km.toString() : "",
          trips: shift.trips ? shift.trips.toString() : "",
        });
        setIsShiftModalOpen(true);
      };

      const handleOpenNewShiftForDate = (dateStr) => {
        setEditingShiftId(null);
        setShiftForm({
          date: dateStr,
          platform: "uber",
          income: "",
          hours: "",
          km: "",
          trips: "",
        });
        setIsShiftModalOpen(true);
      };

      // EXCLUSÃO DE TURNO: ESTORNA O VALOR PAGO NAS METAS
      const handleDeleteShift = (id) => {
        if (!confirm("Tem certeza que deseja excluir esse turno? O valor será removido da carteira.")) return;
        const shiftToDelete = shifts.find(s => s.id === id);
        if (!shiftToDelete) return;

        // Estorna os valores das metas pagas nesse turno
        const shiftAllocations = shiftToDelete.allocations || {};
        setDebts(prev =>
          prev.map(d => {
            const paidInThisShift = parseFloat(shiftAllocations[d.id]) || 0;
            if (paidInThisShift > 0) {
              return { ...d, current: Math.max(0, d.current - paidInThisShift) };
            }
            return d;
          })
        );

        // Remove o turno e ajusta saldo não alocado
        setShifts(prev => prev.filter(s => s.id !== id));
        let totalAllocatedInShift = 0;
        Object.values(shiftAllocations).forEach(v => { totalAllocatedInShift += parseFloat(v) || 0; });
        const unallocatedIncome = shiftToDelete.income - totalAllocatedInShift;
        setWallet(prev => Math.max(0, prev - unallocatedIncome));

        setIsShiftModalOpen(false);
        setEditingShiftId(null);
      };

      // Gastos Extras
      const handleSaveExpense = (e) => {
        e.preventDefault();
        const amount = parseFloat(expenseForm.amount) || 0;
        if (amount <= 0) return;

        if (editingExpenseId) {
          const oldExpense = expenses.find(exp => exp.id === editingExpenseId);
          const oldAmount = oldExpense ? oldExpense.amount : 0;
          const diff = amount - oldAmount;

          if (diff > wallet) {
            alert("Saldo insuficiente na carteira!");
            return;
          }

          setExpenses(prev => prev.map(exp => (exp.id === editingExpenseId ? { ...exp, date: expenseForm.date, amount, description: expenseForm.description || "Gasto Extra" } : exp)));
          setWallet(prev => prev - diff);
        } else {
          if (amount > wallet) {
            alert("Saldo insuficiente na carteira!");
            return;
          }

          setExpenses([{ id: Date.now(), amount, description: expenseForm.description || "Gasto Extra", date: expenseForm.date }, ...expenses]);
          setWallet(prev => prev - amount);
        }

        setIsExpenseModalOpen(false);
        setEditingExpenseId(null);
        setExpenseForm({ amount: "", description: "", date: getTodayLocalDate() });
      };

      const handleOpenEditExpense = (expense) => {
        setEditingExpenseId(expense.id);
        setExpenseForm({ date: expense.date, amount: expense.amount.toString(), description: expense.description || "" });
        setIsExpenseModalOpen(true);
      };

      const handleDeleteExpense = (id) => {
        if (!confirm("Deseja apagar esse gasto extra? O valor será estornado para a carteira.")) return;
        const expToDelete = expenses.find(exp => exp.id === id);
        if (!expToDelete) return;

        setExpenses(prev => prev.filter(exp => exp.id !== id));
        setWallet(prev => prev + expToDelete.amount);
        setIsExpenseModalOpen(false);
        setEditingExpenseId(null);
      };

      // Metas
      const handleSaveDebt = (e) => {
        e.preventDefault();
        if (!debtForm.name) return;
        const groupId = debtForm.groupId ? parseInt(debtForm.groupId) : null;

        let target;
        let installments = null;
        if (debtForm.isInstallment) {
          const total = parseInt(debtForm.installmentTotal) || 0;
          const value = parseFloat(debtForm.installmentValue) || 0;
          if (total <= 0 || value <= 0 || !debtForm.installmentFirstDue) return;
          target = total * value;
          installments = { total, value, firstDueDate: debtForm.installmentFirstDue };
        } else {
          target = parseFloat(debtForm.target) || 0;
          if (target <= 0) return;
        }

        if (editingDebtId) {
          setDebts(prev => prev.map(d => (d.id === editingDebtId ? { ...d, name: debtForm.name, target, groupId, installments } : d)));
        } else {
          setDebts([...debts, { id: Date.now(), name: debtForm.name, target, current: 0, groupId, installments }]);
        }

        setDebtForm({
          name: "",
          target: "",
          groupId: "",
          isInstallment: false,
          installmentTotal: "",
          installmentValue: "",
          installmentFirstDue: getTodayLocalDate(),
        });
        setEditingDebtId(null);
        setIsDebtEditModalOpen(false);
      };

      const handleOpenEditDebt = (debt) => {
        setEditingDebtId(debt.id);
        setDebtForm({
          name: debt.name,
          target: debt.target.toString(),
          groupId: debt.groupId != null ? debt.groupId.toString() : "",
          isInstallment: !!debt.installments,
          installmentTotal: debt.installments ? debt.installments.total.toString() : "",
          installmentValue: debt.installments ? debt.installments.value.toString() : "",
          installmentFirstDue: debt.installments ? debt.installments.firstDueDate : getTodayLocalDate(),
        });
        setIsDebtEditModalOpen(true);
      };

      const handleDeleteDebt = (id) => {
        if (!confirm("Mover esta meta para a lixeira? Você pode restaurá-la depois.")) return;
        setDebts(prev => prev.map(d => (d.id === id ? { ...d, deletedAt: Date.now() } : d)));
      };

      const handleRestoreDebt = (id) => {
        setDebts(prev => prev.map(d => (d.id === id ? { ...d, deletedAt: null } : d)));
      };

      const handlePermanentlyDeleteDebt = (id) => {
        if (!confirm("Excluir esta meta para sempre? Essa ação não pode ser desfeita.")) return;
        setDebts(prev => prev.filter(d => d.id !== id));
      };

      const handleEmptyTrash = () => {
        if (!confirm("Excluir permanentemente todas as metas da lixeira? Essa ação não pode ser desfeita.")) return;
        setDebts(prev => prev.filter(d => !d.deletedAt));
      };

      // Função manual de reset caso precise zerar o valor pago de uma meta específica
      const handleResetDebtPayment = (id) => {
        if (!confirm("Deseja zerar o valor pago desta conta?")) return;
        setDebts(prev => prev.map(d => (d.id === id ? { ...d, current: 0 } : d)));
      };

      // Marca a meta como paga por inteiro de uma vez (check rápido)
      const handleMarkDebtPaid = (id) => {
        setDebts(prev => prev.map(d => (d.id === id ? { ...d, current: d.target } : d)));
      };

      // Paga exatamente o valor de uma parcela (para metas parceladas)
      const handlePayOneInstallment = (debt) => {
        if (!debt.installments) return;
        setDebts(prev =>
          prev.map(d => (d.id === debt.id ? { ...d, current: Math.min(d.target, d.current + debt.installments.value) } : d))
        );
      };

      // Pagamento parcial rápido: soma um valor ao que já foi pago na meta
      const handleOpenPartialPay = (debt) => {
        setPayingDebtId(debt.id);
        setPartialPayValue("");
        setIsPartialPayModalOpen(true);
      };

      const handleSavePartialPay = (e) => {
        e.preventDefault();
        const value = parseFloat(partialPayValue);
        if (isNaN(value) || value <= 0) return;
        setDebts(prev =>
          prev.map(d => (d.id === payingDebtId ? { ...d, current: Math.min(d.target, d.current + value) } : d))
        );
        setIsPartialPayModalOpen(false);
        setPayingDebtId(null);
        setPartialPayValue("");
      };

      // Grupos (metas menores)
      const handleSaveGroup = (e) => {
        e.preventDefault();
        const name = groupForm.name.trim();
        if (!name) return;

        if (editingGroupId) {
          setGroups(prev => prev.map(g => (g.id === editingGroupId ? { ...g, name } : g)));
        } else {
          setGroups(prev => [...prev, { id: Date.now(), name }]);
        }

        setGroupForm({ name: "" });
        setEditingGroupId(null);
      };

      const handleOpenEditGroup = (group) => {
        setEditingGroupId(group.id);
        setGroupForm({ name: group.name });
      };

      const handleCancelEditGroup = () => {
        setEditingGroupId(null);
        setGroupForm({ name: "" });
      };

      const handleDeleteGroup = (id) => {
        if (!confirm("Excluir este grupo? As metas dele voltam a ficar sem grupo.")) return;
        setGroups(prev => prev.filter(g => g.id !== id));
        if (editingGroupId === id) handleCancelEditGroup();
      };

      const handleMoveGroup = (id, direction) => {
        setGroups(prev => {
          const idx = prev.findIndex(g => g.id === id);
          const newIdx = idx + direction;
          if (idx < 0 || newIdx < 0 || newIdx >= prev.length) return prev;
          const copy = [...prev];
          [copy[idx], copy[newIdx]] = [copy[newIdx], copy[idx]];
          return copy;
        });
      };

      // Ajuste manual da renda mensal
      const handleSaveIncomeEdit = (e) => {
        e.preventDefault();
        const value = parseFloat(incomeEditValue);
        if (isNaN(value) || value < 0) return;
        setMonthlyIncome(value);
        setIsIncomeEditModalOpen(false);
      };

      // Categorias das contas fixas (Renda)
      const handleSaveFixedExpenseGroup = (e) => {
        e.preventDefault();
        const name = fixedExpenseGroupForm.name.trim();
        if (!name) return;

        if (editingFixedExpenseGroupId) {
          setFixedExpenseGroups(prev => prev.map(g => (g.id === editingFixedExpenseGroupId ? { ...g, name } : g)));
        } else {
          setFixedExpenseGroups(prev => [...prev, { id: Date.now(), name }]);
        }

        setFixedExpenseGroupForm({ name: "" });
        setEditingFixedExpenseGroupId(null);
      };

      const handleOpenEditFixedExpenseGroup = (group) => {
        setEditingFixedExpenseGroupId(group.id);
        setFixedExpenseGroupForm({ name: group.name });
      };

      const handleCancelEditFixedExpenseGroup = () => {
        setEditingFixedExpenseGroupId(null);
        setFixedExpenseGroupForm({ name: "" });
      };

      const handleDeleteFixedExpenseGroup = (id) => {
        if (!confirm("Excluir esta categoria? As contas dela voltam a ficar sem categoria.")) return;
        setFixedExpenseGroups(prev => prev.filter(g => g.id !== id));
        if (editingFixedExpenseGroupId === id) handleCancelEditFixedExpenseGroup();
      };

      const handleMoveFixedExpenseGroup = (id, direction) => {
        setFixedExpenseGroups(prev => {
          const idx = prev.findIndex(g => g.id === id);
          const newIdx = idx + direction;
          if (idx < 0 || newIdx < 0 || newIdx >= prev.length) return prev;
          const copy = [...prev];
          [copy[idx], copy[newIdx]] = [copy[newIdx], copy[idx]];
          return copy;
        });
      };

      const toggleFixedExpenseGroupCollapse = (id) => {
        setCollapsedFixedExpenseGroups(prev => ({ ...prev, [id]: !prev[id] }));
      };

      // Contas fixas (Renda)
      const handleSaveFixedExpense = (e) => {
        e.preventDefault();
        const value = parseFloat(fixedExpenseForm.value) || 0;
        if (!fixedExpenseForm.name || value <= 0) return;
        const groupId = fixedExpenseForm.groupId ? parseInt(fixedExpenseForm.groupId) : null;

        if (editingFixedExpenseId) {
          setFixedExpenses(prev => prev.map(e => (e.id === editingFixedExpenseId ? { ...e, name: fixedExpenseForm.name, value, groupId } : e)));
        } else {
          setFixedExpenses(prev => [...prev, { id: Date.now(), name: fixedExpenseForm.name, value, groupId }]);
        }

        setFixedExpenseForm({ name: "", value: "", groupId: "" });
        setEditingFixedExpenseId(null);
        setIsFixedExpenseFormModalOpen(false);
      };

      const handleOpenEditFixedExpense = (expense) => {
        setEditingFixedExpenseId(expense.id);
        setFixedExpenseForm({
          name: expense.name,
          value: expense.value.toString(),
          groupId: expense.groupId != null ? expense.groupId.toString() : "",
        });
        setIsFixedExpenseFormModalOpen(true);
      };

      const handleDeleteFixedExpense = (id) => {
        if (!confirm("Excluir esta conta fixa?")) return;
        setFixedExpenses(prev => prev.filter(e => e.id !== id));
      };

      // Ajuste manual do saldo da carteira
      const handleSaveWalletEdit = (e) => {
        e.preventDefault();
        const value = parseFloat(walletEditValue);
        if (isNaN(value) || value < 0) return;
        setWallet(value);
        setIsWalletEditModalOpen(false);
      };

      // Backup: baixa um arquivo .json com todos os dados do app
      const handleExportBackup = () => {
        const backup = {
          version: 1,
          exportedAt: new Date().toISOString(),
          wallet, shifts, expenses, debts, groups, weeklyGoal,
          monthlyIncome, fixedExpenseGroups, fixedExpenses
        };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `rota-da-liberdade-backup-${getTodayLocalDate()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      // Backup: restaura os dados a partir de um arquivo .json exportado antes
      const handleImportBackupFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (!confirm("Restaurar esse backup vai substituir os dados atuais no app (carteira, turnos, gastos, metas e grupos). Deseja continuar?")) {
              return;
            }
            if (typeof data.wallet === "number") setWallet(data.wallet);
            if (Array.isArray(data.shifts)) setShifts(data.shifts);
            if (Array.isArray(data.expenses)) setExpenses(data.expenses);
            if (Array.isArray(data.debts)) setDebts(data.debts);
            if (Array.isArray(data.groups)) setGroups(data.groups);
            if (typeof data.weeklyGoal === "number") setWeeklyGoal(data.weeklyGoal);
            if (typeof data.monthlyIncome === "number") setMonthlyIncome(data.monthlyIncome);
            if (Array.isArray(data.fixedExpenseGroups)) setFixedExpenseGroups(data.fixedExpenseGroups);
            if (Array.isArray(data.fixedExpenses)) setFixedExpenses(data.fixedExpenses);
            alert("Backup restaurado com sucesso!");
            setIsBackupModalOpen(false);
          } catch (err) {
            alert("Não foi possível ler esse arquivo. Verifique se é um backup válido gerado pelo próprio app.");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      };

      // Total ganho por mês, para o Dashboard Mensal
      const monthlyTotals = useMemo(() => {
        const map = {};
        shifts.forEach(s => {
          const monthKey = s.date.slice(0, 7);
          if (!map[monthKey]) map[monthKey] = { income: 0, hours: 0, km: 0, trips: 0, count: 0 };
          map[monthKey].income += s.income;
          map[monthKey].hours += s.hours;
          map[monthKey].km += s.km;
          map[monthKey].trips += s.trips;
          map[monthKey].count += 1;
        });

        const maxIncome = Math.max(...Object.values(map).map(v => v.income), 0);

        return Object.entries(map)
          .map(([key, vals]) => {
            const [year, month] = key.split("-").map(Number);
            return {
              key,
              label: `${MONTH_FULL_NAMES[month - 1]} de ${year}`,
              maxIncome,
              ...vals
            };
          })
          .sort((a, b) => b.key.localeCompare(a.key));
      }, [shifts]);

      // Total ganho por dia dentro do mês selecionado no Dashboard Mensal
      const dailyTotalsForSelectedMonth = useMemo(() => {
        if (!selectedMonthKey) return [];

        const map = {};
        shifts.forEach(s => {
          if (s.date.slice(0, 7) !== selectedMonthKey) return;
          if (!map[s.date]) map[s.date] = { income: 0, hours: 0, km: 0, trips: 0, count: 0, shiftsList: [] };
          map[s.date].income += s.income;
          map[s.date].hours += s.hours;
          map[s.date].km += s.km;
          map[s.date].trips += s.trips;
          map[s.date].count += 1;
          map[s.date].shiftsList.push(s);
        });

        const maxIncome = Math.max(...Object.values(map).map(v => v.income), 0);

        return Object.entries(map)
          .map(([dateStr, vals]) => {
            const [year, month, day] = dateStr.split("-").map(Number);
            const dateObj = new Date(year, month - 1, day);
            return {
              key: dateStr,
              label: `${day} de ${MONTH_FULL_NAMES[month - 1]} (${WEEKDAY_SHORT_NAMES[dateObj.getDay()]})`,
              maxIncome,
              ...vals
            };
          })
          .sort((a, b) => b.key.localeCompare(a.key));
      }, [shifts, selectedMonthKey]);

      return (
        <div className="max-w-md mx-auto min-h-screen bg-black text-white p-4 space-y-6">

          {/* BOTÃO RENDA: bem no topo, acima de tudo */}
          <div className="flex justify-end -mb-2">
            <button
              onClick={() => setIsIncomeModalOpen(true)}
              className="text-[11px] bg-zinc-900 hover:bg-zinc-800 text-emerald-400 border border-zinc-800 px-2.5 py-1 rounded-full flex items-center gap-1 transition active:scale-95"
            >
              <Icon name="wallet" size={11} /> Renda
            </button>
          </div>

          {/* TOPO: Carteira */}
          <header className="bg-zinc-950 border border-zinc-800/80 p-4 rounded-2xl">
            <div className="flex justify-between items-center mb-3">
              <div>
                <span className="text-[11px] text-zinc-400 font-semibold uppercase tracking-wider">Saldo na Carteira</span>
                <div className="flex items-center gap-2">
                  <div className="text-2xl font-extrabold text-amber-400">
                    R$ {wallet.toFixed(2)}
                  </div>
                  <button
                    onClick={() => {
                      setWalletEditValue(wallet.toFixed(2));
                      setIsWalletEditModalOpen(true);
                    }}
                    className="text-zinc-500 hover:text-sky-400 p-1 transition"
                    title="Ajustar saldo da carteira"
                  >
                    <Icon name="pencil" size={14} />
                  </button>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setIsMonthlyModalOpen(true)}
                  className="text-xs bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-xl border border-zinc-700/80 flex items-center gap-1.5 transition active:scale-95"
                >
                  <Icon name="bar-chart-3" size={14} className="text-amber-400" />
                  <span>Por Mês</span>
                </button>

                            {isSectionDone && (

                          <span className="text-[10px] text-zinc-400 shrink-0">

                                style={{ width: `${section.percent}%` }}
                              ></div>
                            </div>

                              const isPaid = debt.current >= debt.target;
                              const installmentsPaid = debt.installments
                                ? Math.min(debt.installments.total, Math.round(debt.current / debt.installments.value))
                                : null;
                              const installmentsLeft = debt.installments ? debt.installments.total - installmentsPaid : null;
                              return (
                                <div
                                  key={debt.id}
                                  className={`p-3 rounded-2xl border transition flex justify-between items-center ${
                                    isPaid ? "bg-emerald-950/20 border-emerald-500/30" : "bg-zinc-950 border-zinc-800"
                                  }`}
                                >
                                  <div>
                                    <div className="flex items-center gap-1.5">
                                      <span className={`text-xs font-bold ${isPaid ? "text-emerald-400 line-through" : "text-white"}`}>

                                    <span className="text-[11px] text-zinc-400">

                                        <Icon name="rotate-ccw" size={14} />
                                      </button>

                                      <button
                                        onClick={() => handlePayOneInstallment(debt)}
                                        className="p-1.5 text-zinc-400 hover:text-sky-400 transition"
                                        title={`Pagar 1 parcela (R$ ${debt.installments.value.toFixed(2)})`}

                                        <Icon name="calendar-check" size={14} />
                                      </button>

                                      <button

                                        className="p-1.5 text-zinc-400 hover:text-amber-400 transition"

                                        <Icon name="coins" size={14} />
                                      </button>

                                      <button
                                        onClick={() => handleMarkDebtPaid(debt.id)}
                                        className="p-1.5 text-zinc-400 hover:text-emerald-400 transition"

                                      >
                                        <Icon name="check-circle" size={14} />
                                      </button>

                                      className="p-1.5 text-zinc-400 hover:text-sky-400 transition"
                                      title="Editar meta"
                                    >
                                      <Icon name="pencil" size={14} />
                                    </button>
                                    <button
                                      onClick={() => handleDeleteDebt(debt.id)}
                                      className="p-1.5 text-zinc-400 hover:text-rose-400 transition"
                                      title="Excluir meta"
                                    >
                                      <Icon name="trash-2" size={14} />
                                    </button>
                                  </div>
                                </div>
                              );
                            })}
                          </div>

                      </div>

              </div>

                    <Icon name="x" size={20} />

                          title="Mover para cima"

                          <Icon name="chevron-up" size={14} />

                          <Icon name="chevron-down" size={14} />
                        </button>

                        <Icon name="pencil" size={14} />
                      </button>

                        className="p-1.5 text-zinc-400 hover:text-rose-400 transition"
                        title="Excluir grupo"
                      >
                        <Icon name="trash-2" size={14} />
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>

                          <Icon name="rotate-ccw" size={14} />

                          <Icon name="trash-2" size={14} />
                        </button>
                      </div>
                    </div>

                </div>

              <div className="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl max-h-[85vh] flex flex-col">
                <div className="flex justify-between items-center mb-3">

                    <Icon name="x" size={20} />

                      <div className="space-y-1.5 pt-2 border-t border-zinc-800/60">

                          <div key={`${item.debtId}-${item.installmentNumber}`} className="flex justify-between items-center text-[11px]">
                            <span className="text-zinc-400">
                              {item.name} <span className="text-zinc-600">({item.installmentNumber}/{item.totalInstallments})</span>
                            </span>
                            <span className="text-zinc-300 font-semibold">R$ {item.value.toFixed(2)}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-[60] flex items-center justify-center p-4">

                  </h3>
                  <button onClick={() => setIsDebtEditModalOpen(false)} className="text-zinc-400 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>

                      required
                      placeholder="Ex: Empréstimo do Banco"

                      onChange={e => setDebtForm({ ...debtForm, name: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-400"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Essa meta é parcelada?</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setDebtForm({ ...debtForm, isInstallment: false })}
                        className={`py-2 rounded-xl text-xs font-bold border transition ${
                          !debtForm.isInstallment
                            ? "bg-white text-black border-white"
                            : "bg-zinc-800 text-zinc-400 border-zinc-700"
                        }`}
                      >
                        Não
                      </button>
                      <button
                        type="button"
                        onClick={() => setDebtForm({ ...debtForm, isInstallment: true })}
                        className={`py-2 rounded-xl text-xs font-bold border transition ${
                          debtForm.isInstallment
                            ? "bg-sky-500 text-black border-sky-500"
                            : "bg-zinc-800 text-zinc-400 border-zinc-700"

                      >
                        Sim, em parcelas
                      </button>
                    </div>

                  {!debtForm.isInstallment ? (
                    <div>
                      <label className="text-[11px] text-zinc-400 block mb-1">Valor Total (R$)</label>
                      <input
                        type="number"
                        step="0.01"
                        required
                        placeholder="Ex: 600.00"
                        value={debtForm.target}
                        onChange={e => setDebtForm({ ...debtForm, target: e.target.value })}
                        className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-400"
                      />
                    </div>
                  ) : (
                    <div className="space-y-3 bg-zinc-950/60 border border-zinc-800 rounded-xl p-3">

                            type="number"
                            step="1"
                            required
                            placeholder="Ex: 12"
                            value={debtForm.installmentTotal}

                            className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-sky-400"
                          />
                        </div>
                        <div>
                          <label className="text-[11px] text-zinc-400 block mb-1">Valor de Cada (R$)</label>
                          <input
                            type="number"
                            step="0.01"
                            required

                      <option value="">Sem Grupo</option>

                  </div>
                  <button
                    type="submit"
                    className="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-2.5 rounded-xl active:scale-95 transition mt-2"
                  >
                    {editingDebtId ? "Salvar Alterações" : "Criar Meta"}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: GASTO EXTRA */}
          {isExpenseModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-bold text-base text-rose-400 flex items-center gap-2">
                    <Icon name="arrow-up-right" size={18} />
                    {editingExpenseId ? "Editar Gasto Extra" : "Novo Gasto Extra"}

                  <button onClick={() => setIsExpenseModalOpen(false)} className="text-zinc-400 hover:text-white">

                      value={expenseForm.date}

                    <input

                      step="0.01"
                      required
                      placeholder="Ex: 50.00"
                      value={expenseForm.amount}
                      onChange={e => setExpenseForm({ ...expenseForm, amount: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-rose-400"

          {/* MODAL: DETALHE DIÁRIO DO MÊS SELECIONADO */}
          {isDayDetailModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-3xl p-5 shadow-2xl max-h-[88vh] flex flex-col">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-bold text-base text-white flex items-center gap-2 min-w-0">
                    <button
                      onClick={() => {
                        setIsDayDetailModalOpen(false);
                        setIsMonthlyModalOpen(true);
                      }}
                      className="text-zinc-400 hover:text-white -ml-1 p-1 shrink-0"
                    >
                      <Icon name="chevron-left" size={18} />
                    </button>
                    <span className="truncate">
                      {monthlyTotals.find(m => m.key === selectedMonthKey)?.label || "Detalhe do Mês"}
                    </span>
                  </h3>
                  <button
                    onClick={() => { setIsDayDetailModalOpen(false); setSelectedMonthKey(null); }}
                    className="text-zinc-400 hover:text-white shrink-0"
                  >
                    <Icon name="x" size={20} />
                  </button>
                </div>

                <div className="space-y-2 overflow-y-auto pr-1 flex-1">
                  {dailyTotalsForSelectedMonth.length === 0 && (
                    <p className="text-xs text-zinc-500 text-center py-6">Nenhuma diária neste mês.</p>
                  )}
                  {dailyTotalsForSelectedMonth.map(day => {
                    const barPercent = day.maxIncome > 0 ? Math.max(4, Math.round((day.income / day.maxIncome) * 100)) : 0;
                    return (
                      <div key={day.key} className="bg-zinc-950 border border-zinc-800 rounded-2xl p-3.5">
                        <div className="flex justify-between items-baseline mb-1.5">
                          <span className="text-xs font-bold text-zinc-200">{day.label}</span>
                          <span className="text-lg font-extrabold text-amber-400">
                            R$ {day.income.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                          </span>
                        </div>

                        <div className="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden mb-2.5">
                          <div
                            className="bg-gradient-to-r from-amber-500 to-emerald-400 h-full transition-all duration-500"
                            style={{ width: `${barPercent}%` }}
                          ></div>
                        </div>

                        <div className="grid grid-cols-4 gap-1 text-center pt-2 border-t border-zinc-800/60">
                          <div>
                            <p className="text-[10px] text-zinc-500">Turnos</p>
                            <p className="text-xs font-bold text-white">{day.count}</p>
                          </div>
                          <div>
                            <p className="text-[10px] text-zinc-500">Online</p>
                            <p className="text-xs font-bold text-white">{formatHoursMinutes(day.hours)}</p>
                          </div>
                          <div>
                            <p className="text-[10px] text-zinc-500">Viagens</p>
                            <p className="text-xs font-bold text-white">{day.trips}</p>
                          </div>
                          <div>
                            <p className="text-[10px] text-zinc-500">Km</p>
                            <p className="text-xs font-bold text-white">{day.km}</p>
                          </div>
                        </div>

                        <div className="space-y-1.5 mt-3 pt-3 border-t border-zinc-800/60">
                          {day.shiftsList.map(shift => (
                            <div
                              key={shift.id}
                              className="bg-zinc-900 border border-zinc-800/80 p-2 rounded-xl flex justify-between items-center"
                            >
                              <div className="flex items-center gap-2">
                                <span
                                  className={`text-[10px] font-extrabold px-1.5 py-0.5 rounded ${
                                    (shift.platform || "uber") === "99" ? "bg-orange-500 text-black" : "bg-white text-black"
                                  }`}
                                >
                                  {(shift.platform || "uber") === "99" ? "99" : "Uber"}
                                </span>
                                <span className="text-xs font-bold text-zinc-200">
                                  R$ {shift.income.toFixed(2)}
                                </span>
                              </div>
                              <div className="flex items-center gap-1">
                                <button
                                  onClick={() => handleOpenEditShift(shift)}
                                  className="p-1.5 text-zinc-400 hover:text-sky-400 transition"
                                  title="Editar turno"
                                >
                                  <Icon name="pencil" size={13} />
                                </button>
                                <button
                                  onClick={() => handleDeleteShift(shift.id)}
                                  className="p-1.5 text-zinc-400 hover:text-rose-400 transition"
                                  title="Excluir turno"
                                >
                                  <Icon name="trash-2" size={13} />
                                </button>
                              </div>
                            </div>
                          ))}
                          <button
                            onClick={() => handleOpenNewShiftForDate(day.key)}
                            className="w-full text-xs bg-zinc-900 hover:bg-zinc-800 text-emerald-400 border border-dashed border-zinc-700 py-2 rounded-xl flex items-center justify-center gap-1.5 transition active:scale-95"
                          >
                            <Icon name="plus" size={13} /> Adicionar Turno Neste Dia
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
