<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rota da Liberdade - Gamificação das Entregas</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons & Canvas Confetti -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #000000;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
    }
    .road-track {
      background: repeating-linear-gradient(
        to right,
        #facc15 0px,
        #facc15 16px,
        transparent 16px,
        transparent 32px
      );
    }
    @keyframes bobble {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(2deg); }
    }
    .bike-animation {
      animation: bobble 1.8s ease-in-out infinite;
    }
  </style>
</head>
<body class="antialiased pb-28">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const getTodayLocalDate = () => {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().split("T")[0];
    };

    const formatHoursMinutes = (decimalHours) => {
      if (!decimalHours || decimalHours <= 0) return "0 h 0 m";
      const totalMinutes = Math.round(decimalHours * 60);
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      return `${h} h ${m} m`;
    };

    const Icon = ({ name, size = 20, className = "" }) => {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
    };

    const baseHistoricalShifts = [
      { id: 901,  date: "2026-08-12", income: 177.82, hours: 6.383, km: 0, trips: 13, allocations: {} },
      { id: 902,  date: "2026-08-13", income: 75.93,  hours: 2.266, km: 0, trips: 4,  allocations: {} },
      { id: 1000, date: "2026-08-17", income: 36.40,  hours: 1.933, km: 0, trips: 3,  allocations: {} },
      { id: 1001, date: "2026-08-18", income: 100.31, hours: 4.166, km: 0, trips: 6,  allocations: {} },
      { id: 1002, date: "2026-08-19", income: 115.93, hours: 6.333, km: 0, trips: 12, allocations: {} },
      { id: 1003, date: "2026-08-20", income: 185.52, hours: 7.950, km: 0, trips: 15, allocations: {} },
      { id: 1004, date: "2026-08-21", income: 112.15, hours: 5.016, km: 0, trips: 9,  allocations: {} },
      { id: 1005, date: "2026-08-22", income: 20.80,  hours: 1.200, km: 0, trips: 3,  allocations: {} },
      { id: 1006, date: "2026-08-24", income: 59.76,  hours: 2.766, km: 0, trips: 8,  allocations: {} },
      { id: 1007, date: "2026-08-25", income: 103.64, hours: 5.150, km: 0, trips: 13, allocations: {} },
      { id: 1008, date: "2026-08-26", income: 227.38, hours: 10.166, km: 0, trips: 21, allocations: {} },
      { id: 1009, date: "2026-08-27", income: 166.56, hours: 7.566, km: 0, trips: 19, allocations: {} },
      { id: 1010, date: "2026-08-28", income: 150.69, hours: 4.783, km: 0, trips: 10, allocations: {} },
      { id: 1011, date: "2026-08-29", income: 88.73,  hours: 3.466, km: 0, trips: 8,  allocations: {} },
      { id: 1012, date: "2026-08-30", income: 144.43, hours: 5.650, km: 0, trips: 12, allocations: {} },
    ];

    const initialDebtsList = [
      { id: 101, name: "Luz (Terreiro)", target: 285.00, current: 0 },
      { id: 102, name: "Água (Terreiro)", target: 120.00, current: 0 },
      { id: 103, name: "Claro (Terreiro)", target: 240.00, current: 0 },
      { id: 104, name: "Alarme (Terreiro)", target: 400.00, current: 0 },
      { id: 105, name: "Aluguel (Terreiro)", target: 1000.00, current: 0 },
      { id: 106, name: "Fernanda", target: 1200.00, current: 0 },
      { id: 107, name: "Tassiana", target: 760.00, current: 0 },
      { id: 108, name: "Everson", target: 1200.00, current: 0 },
      { id: 109, name: "Facio", target: 497.84, current: 0 },
      { id: 110, name: "Bitpay / Bepay", target: 232.98, current: 0 },
      { id: 111, name: "iFood", target: 380.49, current: 0 },
      { id: 112, name: "Infinity", target: 353.73, current: 0 },
      { id: 113, name: "Inter", target: 300.49, current: 0 },
      { id: 201, name: "Luz (Casa)", target: 380.00, current: 0 },
      { id: 202, name: "Gás (Casa)", target: 200.00, current: 0 },
      { id: 203, name: "Claro (Casa)", target: 155.00, current: 0 },
      { id: 204, name: "Vivo", target: 190.00, current: 0 },
      { id: 205, name: "Psico", target: 450.00, current: 0 },
      { id: 206, name: "Psiq", target: 150.00, current: 0 },
      { id: 207, name: "Ração", target: 330.00, current: 0 },
      { id: 208, name: "Petlove", target: 460.00, current: 0 },
      { id: 209, name: "Unha", target: 160.00, current: 0 },
      { id: 210, name: "Murilo / Muilo", target: 120.00, current: 0 },
      { id: 211, name: "Cloud", target: 67.00, current: 0 },
      { id: 212, name: "Claude", target: 110.00, current: 0 },
      { id: 213, name: "BB", target: 57.00, current: 0 },
      { id: 214, name: "Delicato", target: 400.00, current: 0 },
      { id: 215, name: "Gympass", target: 350.00, current: 0 },
      { id: 216, name: "Gabriella / Gabrilla", target: 426.00, current: 0 },
      { id: 217, name: "Stephanie", target: 500.00, current: 0 },
      { id: 218, name: "Ferragem", target: 353.00, current: 0 },
    ];

    const recoverAllShifts = () => {
      const keys = ["rota_shifts_master", "rota_shifts_v4", "rota_shifts_v3", "rota_shifts_v2", "rota_shifts"];
      let combined = [...baseHistoricalShifts];
      const seen = new Set(combined.map(s => `${s.date}_${s.income}`));

      keys.forEach(k => {
        try {
          const raw = localStorage.getItem(k);
          if (raw) {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr)) {
              arr.forEach(item => {
                const key = `${item.date}_${item.income}`;
                if (!seen.has(key)) {
                  seen.add(key);
                  combined.push({ allocations: {}, ...item });
                }
              });
            }
          }
        } catch(e) {}
      });

      return combined.sort((a, b) => b.date.localeCompare(a.date));
    };

    function App() {
      const [wallet, setWallet] = useState(() => {
        const saved = localStorage.getItem("rota_wallet_master");
        if (saved) return JSON.parse(saved);
        const oldWallet = localStorage.getItem("rota_wallet_v4") || localStorage.getItem("rota_wallet");
        return oldWallet ? JSON.parse(oldWallet) : 51.17;
      });

      const [shifts, setShifts] = useState(() => recoverAllShifts());

      const [expenses, setExpenses] = useState(() => {
        const saved = localStorage.getItem("rota_expenses_master");
        if (saved) return JSON.parse(saved);
        const old = localStorage.getItem("rota_expenses_v4") || localStorage.getItem("rota_expenses");
        return old ? JSON.parse(old) : [];
      });

      const [debts, setDebts] = useState(() => {
        const saved = localStorage.getItem("rota_debts_master");
        if (saved) return JSON.parse(saved);
        const old = localStorage.getItem("rota_debts_v3") || localStorage.getItem("rota_debts_v2");
        return old ? JSON.parse(old) : initialDebtsList;
      });

      const [groups, setGroups] = useState(() => {
        const saved = localStorage.getItem("rota_groups_master");
        return saved ? JSON.parse(saved) : [];
      });

      const [weeklyGoal, setWeeklyGoal] = useState(() => {
        const saved = localStorage.getItem("rota_goal");
        return saved ? parseFloat(saved) : 800;
      });

      const [weekOffset, setWeekOffset] = useState(0);
      const [selectedDayIndex, setSelectedDayIndex] = useState(null);

      // Modais
      const [isShiftModalOpen, setIsShiftModalOpen] = useState(false);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      const [isDebtsListModalOpen, setIsDebtsListModalOpen] = useState(false);
      const [isDebtEditModalOpen, setIsDebtEditModalOpen] = useState(false);
      const [isGroupsModalOpen, setIsGroupsModalOpen] = useState(false);
      const [isTrashModalOpen, setIsTrashModalOpen] = useState(false);

      // Edições
      const [editingShiftId, setEditingShiftId] = useState(null);
      const [editingExpenseId, setEditingExpenseId] = useState(null);
      const [editingDebtId, setEditingDebtId] = useState(null);
      const [editingGroupId, setEditingGroupId] = useState(null);
      const [collapsedGroups, setCollapsedGroups] = useState({});

      const [shiftForm, setShiftForm] = useState({
        date: getTodayLocalDate(),
        income: "",
        hours: "",
        km: "",
        trips: "",
      });

      const [allocations, setAllocations] = useState({});
      const [expenseForm, setExpenseForm] = useState({ amount: "", description: "", date: getTodayLocalDate() });
      const [debtForm, setDebtForm] = useState({ name: "", target: "", groupId: "" });
      const [groupForm, setGroupForm] = useState({ name: "" });

      useEffect(() => {
        localStorage.setItem("rota_wallet_master", JSON.stringify(wallet));
        localStorage.setItem("rota_shifts_master", JSON.stringify(shifts));
        localStorage.setItem("rota_expenses_master", JSON.stringify(expenses));
        localStorage.setItem("rota_debts_master", JSON.stringify(debts));
        localStorage.setItem("rota_groups_master", JSON.stringify(groups));
        localStorage.setItem("rota_goal", weeklyGoal.toString());
        if (window.lucide) window.lucide.createIcons();
      }, [wallet, shifts, expenses, debts, groups, weeklyGoal]);

      // Métricas da Semana (Painel Uber + Meta de 800)
      const weekData = useMemo(() => {
        const now = new Date();
        const currentDay = now.getDay() === 0 ? 7 : now.getDay();

        const monday = new Date(now);
        monday.setDate(now.getDate() - (currentDay - 1) + weekOffset * 7);
        monday.setHours(0, 0, 0, 0);

        const days = [];
        const dayNames = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];
        const monthNames = ["jan.", "fev.", "mar.", "abr.", "mai.", "jun.", "jul.", "ago.", "set.", "out.", "nov.", "dez."];

        for (let i = 0; i < 7; i++) {
          const d = new Date(monday);
          d.setDate(monday.getDate() + i);
          
          const localISO = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split("T")[0];
          const dayShifts = shifts.filter(s => s.date === localISO);
          const dayExpenses = expenses.filter(e => e.date === localISO);

          const income = dayShifts.reduce((acc, s) => acc + s.income, 0);
          const hours = dayShifts.reduce((acc, s) => acc + s.hours, 0);
          const km = dayShifts.reduce((acc, s) => acc + s.km, 0);
          const trips = dayShifts.reduce((acc, s) => acc + s.trips, 0);

          days.push({
            dateStr: localISO,
            dayNum: d.getDate(),
            monthName: monthNames[d.getMonth()],
            dayName: dayNames[i],
            income,
            hours,
            km,
            trips,
            shiftsList: dayShifts,
            expensesList: dayExpenses,
            hasWork: dayShifts.length > 0
          });
        }

        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);

        const dateRangeLabel = `${monday.getDate()} de ${monthNames[monday.getMonth()]} – ${sunday.getDate()} de ${monthNames[sunday.getMonth()]}`;

        const totalIncome = days.reduce((acc, d) => acc + d.income, 0);
        const totalHours = days.reduce((acc, d) => acc + d.hours, 0);
        const totalKm = days.reduce((acc, d) => acc + d.km, 0);
        const totalTrips = days.reduce((acc, d) => acc + d.trips, 0);

        const startISO = new Date(monday.getTime() - monday.getTimezoneOffset() * 60000).toISOString().split("T")[0];
        const endISO = new Date(sunday.getTime() - sunday.getTimezoneOffset() * 60000).toISOString().split("T")[0];
        const weekExpenses = expenses.filter(e => e.date >= startISO && e.date <= endISO);
        const maxDailyIncome = Math.max(...days.map(d => d.income), 0);

        const daysLeft = weekOffset === 0 ? Math.max(1, 7 - currentDay + 1) : 7;
        const remainingGoal = Math.max(0, weeklyGoal - totalIncome);
        const dailyNeeded = daysLeft > 0 ? (remainingGoal / daysLeft) : 0;
        const goalPercent = Math.min(100, Math.round((totalIncome / weeklyGoal) * 100));

        return {
          days,
          dateRangeLabel,
          totalIncome,
          totalHours,
          totalKm,
          totalTrips,
          weekExpenses,
          maxDailyIncome,
          daysLeft,
          remainingGoal,
          dailyNeeded,
          goalPercent
        };
      }, [shifts, expenses, weekOffset, weeklyGoal]);

      // Metas ativas (exclui as que estão na lixeira) e metas na lixeira
      const activeDebts = useMemo(() => debts.filter(d => !d.deletedAt), [debts]);
      const trashedDebts = useMemo(
        () => debts.filter(d => d.deletedAt).sort((a, b) => b.deletedAt - a.deletedAt),
        [debts]
      );

      // Totais da Trilha
      const debtTotals = useMemo(() => {
        const totalTarget = activeDebts.reduce((acc, d) => acc + d.target, 0);
        const totalPaid = activeDebts.reduce((acc, d) => acc + d.current, 0);
        const allCompleted = activeDebts.length > 0 && activeDebts.every(d => d.current >= d.target);
        const percent = totalTarget > 0 ? Math.min(100, Math.round((totalPaid / totalTarget) * 100)) : 100;
        const totalRemaining = Math.max(0, totalTarget - totalPaid);
        return { totalTarget, totalPaid, totalRemaining, allCompleted, percent };
      }, [activeDebts]);

      // Metas organizadas por Grupo (metas menores dentro de cada grupo)
      const debtGroupsView = useMemo(() => {
        const knownGroupIds = new Set(groups.map(g => g.id));
        const sortDebts = (list) =>
          [...list].sort((a, b) => {
            const aDone = a.current >= a.target;
            const bDone = b.current >= b.target;
            if (aDone !== bDone) return aDone ? 1 : -1;
            return 0;
          });

        const buildSection = (base, groupDebts) => {
          const target = groupDebts.reduce((acc, d) => acc + d.target, 0);
          const paid = groupDebts.reduce((acc, d) => acc + Math.min(d.current, d.target), 0);
          const percent = target > 0 ? Math.min(100, Math.round((paid / target) * 100)) : 0;
          const completedCount = groupDebts.filter(d => d.current >= d.target).length;
          return { ...base, debts: groupDebts, target, paid, percent, completedCount };
        };

        const sections = groups.map(g => buildSection(g, sortDebts(activeDebts.filter(d => d.groupId === g.id))));

        const ungrouped = sortDebts(activeDebts.filter(d => !knownGroupIds.has(d.groupId)));
        if (ungrouped.length > 0) {
          sections.push(buildSection({ id: "ungrouped", name: "Sem Grupo", isUngrouped: true }, ungrouped));
        }

        return sections;
      }, [groups, activeDebts]);

      // Metas pendentes (para pagar no turno) organizadas por Grupo
      const payableDebtsGrouped = useMemo(() => {
        const payable = activeDebts.filter(
          d => d.current < d.target || (editingShiftId && shiftForm.allocations && shiftForm.allocations[d.id])
        );
        const knownGroupIds = new Set(groups.map(g => g.id));
        const sections = groups
          .map(g => ({ ...g, debts: payable.filter(d => d.groupId === g.id) }))
          .filter(s => s.debts.length > 0);

        const ungrouped = payable.filter(d => !knownGroupIds.has(d.groupId));
        if (ungrouped.length > 0) {
          sections.push({ id: "ungrouped", name: "Sem Grupo", debts: ungrouped, isUngrouped: true });
        }
        return sections;
      }, [activeDebts, groups, editingShiftId, shiftForm.allocations]);

      const toggleGroupCollapse = (id) => {
        setCollapsedGroups(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const activeStats = useMemo(() => {
        if (selectedDayIndex !== null && weekData.days[selectedDayIndex]) {
          const d = weekData.days[selectedDayIndex];
          return {
            title: `${d.dayNum} de ${d.monthName} (${d.dayName})`,
            income: d.income,
            hours: d.hours,
            trips: d.trips,
            km: d.km,
            shiftsList: d.shiftsList,
            expensesList: d.expensesList,
            isSingleDay: true
          };
        }
        return {
          title: "Total da Semana",
          income: weekData.totalIncome,
          hours: weekData.totalHours,
          trips: weekData.totalTrips,
          km: weekData.totalKm,
          shiftsList: [],
          expensesList: weekData.weekExpenses,
          isSingleDay: false
        };
      }, [selectedDayIndex, weekData]);

      // Salvar Turno com rastreio de alocação
      const handleSaveShift = (e) => {
        e.preventDefault();
        const income = parseFloat(shiftForm.income) || 0;
        const hours = parseFloat(shiftForm.hours) || 0;
        const km = parseFloat(shiftForm.km) || 0;
        const trips = parseInt(shiftForm.trips) || 0;

        if (income <= 0) return;

        let totalAllocated = 0;
        Object.values(allocations).forEach(val => {
          totalAllocated += parseFloat(val) || 0;
        });

        if (totalAllocated > (income + wallet)) {
          alert("O valor alocado nas metas supera o faturado + saldo da carteira!");
          return;
        }

        if (editingShiftId) {
          const oldShift = shifts.find(s => s.id === editingShiftId);
          const oldAllocations = oldShift?.allocations || {};

          // Ajusta as metas com base na diferença entre alocação antiga e nova
          setDebts(prev =>
            prev.map(d => {
              const oldPaidHere = parseFloat(oldAllocations[d.id]) || 0;
              const newPaidHere = parseFloat(allocations[d.id]) || 0;
              const diff = newPaidHere - oldPaidHere;
              return { ...d, current: Math.max(0, Math.min(d.target, d.current + diff)) };
            })
          );

          const diffIncome = income - (oldShift ? oldShift.income : 0);
          setShifts(prev => prev.map(s => (s.id === editingShiftId ? { ...s, date: shiftForm.date, income, hours, km, trips, allocations } : s)));
          setWallet(prev => Math.max(0, prev + diffIncome - totalAllocated));
        } else {
          if (totalAllocated > 0) {
            setDebts(prev =>
              prev.map(d => {
                const allocatedToThis = parseFloat(allocations[d.id]) || 0;
                if (allocatedToThis > 0) {
                  return { ...d, current: Math.min(d.target, d.current + allocatedToThis) };
                }
                return d;
              })
            );

            if (window.confetti) {
              window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
          }

          const leftOver = income - totalAllocated;
          setShifts([{ id: Date.now(), date: shiftForm.date, income, hours, km, trips, allocations }, ...shifts]);
          setWallet(prev => Math.max(0, prev + leftOver));
        }

        setIsShiftModalOpen(false);
        setEditingShiftId(null);
        setAllocations({});
        setShiftForm({
          date: getTodayLocalDate(),
          income: "",
          hours: "",
          km: "",
          trips: "",
        });
      };

      const handleOpenEditShift = (shift) => {
        setEditingShiftId(shift.id);
        setShiftForm({
          date: shift.date,
          income: shift.income.toString(),
          hours: shift.hours ? shift.hours.toString() : "",
          km: shift.km ? shift.km.toString() : "",
          trips: shift.trips ? shift.trips.toString() : "",
        });
        setAllocations(shift.allocations || {});
        setIsShiftModalOpen(true);
      };

      // EXCLUSÃO DE TURNO: ESTORNA O VALOR PAGO NAS METAS
      const handleDeleteShift = (id) => {
        if (!confirm("Tem certeza que deseja excluir esse turno? Os valores pagos em contas com esse dinheiro serão estornados.")) return;
        const shiftToDelete = shifts.find(s => s.id === id);
        if (!shiftToDelete) return;

        // Estorna os valores das metas pagas nesse turno
        const shiftAllocations = shiftToDelete.allocations || {};
        setDebts(prev =>
          prev.map(d => {
            const paidInThisShift = parseFloat(shiftAllocations[d.id]) || 0;
            if (paidInThisShift > 0) {
              return { ...d, current: Math.max(0, d.current - paidInThisShift) };
            }
            return d;
          })
        );

        // Remove o turno e ajusta saldo não alocado
        setShifts(prev => prev.filter(s => s.id !== id));
        let totalAllocatedInShift = 0;
        Object.values(shiftAllocations).forEach(v => { totalAllocatedInShift += parseFloat(v) || 0; });
        const unallocatedIncome = shiftToDelete.income - totalAllocatedInShift;
        setWallet(prev => Math.max(0, prev - unallocatedIncome));

        setIsShiftModalOpen(false);
        setEditingShiftId(null);
      };

      // Gastos Extras
      const handleSaveExpense = (e) => {
        e.preventDefault();
        const amount = parseFloat(expenseForm.amount) || 0;
        if (amount <= 0) return;

        if (editingExpenseId) {
          const oldExpense = expenses.find(exp => exp.id === editingExpenseId);
          const oldAmount = oldExpense ? oldExpense.amount : 0;
          const diff = amount - oldAmount;

          if (diff > wallet) {
            alert("Saldo insuficiente na carteira!");
            return;
          }

          setExpenses(prev => prev.map(exp => (exp.id === editingExpenseId ? { ...exp, date: expenseForm.date, amount, description: expenseForm.description || "Gasto Extra" } : exp)));
          setWallet(prev => prev - diff);
        } else {
          if (amount > wallet) {
            alert("Saldo insuficiente na carteira!");
            return;
          }

          setExpenses([{ id: Date.now(), amount, description: expenseForm.description || "Gasto Extra", date: expenseForm.date }, ...expenses]);
          setWallet(prev => prev - amount);
        }

        setIsExpenseModalOpen(false);
        setEditingExpenseId(null);
        setExpenseForm({ amount: "", description: "", date: getTodayLocalDate() });
      };

      const handleOpenEditExpense = (expense) => {
        setEditingExpenseId(expense.id);
        setExpenseForm({ date: expense.date, amount: expense.amount.toString(), description: expense.description || "" });
        setIsExpenseModalOpen(true);
      };

      const handleDeleteExpense = (id) => {
        if (!confirm("Deseja apagar esse gasto extra? O valor será estornado para a carteira.")) return;
        const expToDelete = expenses.find(exp => exp.id === id);
        if (!expToDelete) return;

        setExpenses(prev => prev.filter(exp => exp.id !== id));
        setWallet(prev => prev + expToDelete.amount);
        setIsExpenseModalOpen(false);
        setEditingExpenseId(null);
      };

      // Metas
      const handleSaveDebt = (e) => {

                  <div>
                    <h3 className="font-bold text-base text-white flex items-center gap-2">
                      <Icon name="list-checks" size={18} className="text-amber-400" /> Metas Cadastradas
                    </h3>
                    <p className="text-[11px] text-zinc-400">
                      {activeDebts.filter(d => d.current >= d.target).length} de {activeDebts.length} quitadas
                    </p>
                  </div>
                  <button onClick={() => setIsDebtsListModalOpen(false)} className="text-zinc-400 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>

                <div className="grid grid-cols-3 gap-2 mb-3">
                  <button
                    onClick={() => {
                      setEditingDebtId(null);
                      setDebtForm({ name: "", target: "", groupId: groups[0] ? groups[0].id.toString() : "" });
                      setIsDebtEditModalOpen(true);
                    }}
                    className="bg-zinc-800 hover:bg-zinc-700 text-amber-400 border border-zinc-700 font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition"
                  >
                    <Icon name="plus" size={14} /> Nova
                  </button>
                  <button
                    onClick={() => setIsGroupsModalOpen(true)}
                    className="bg-zinc-800 hover:bg-zinc-700 text-sky-400 border border-zinc-700 font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition"
                  >
                    <Icon name="layers" size={14} /> Grupos
                  </button>
                  <button
                    onClick={() => setIsTrashModalOpen(true)}
                    className="relative bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition"
                  >
                    <Icon name="trash-2" size={14} /> Lixeira
                    {trashedDebts.length > 0 && (
                      <span className="absolute -top-1.5 -right-1.5 bg-rose-500 text-white text-[9px] font-extrabold w-4 h-4 rounded-full flex items-center justify-center">
                        {trashedDebts.length}
                      </span>
                    )}
                  </button>
                </div>

                <div className="space-y-4 overflow-y-auto pr-1 flex-1">
                  {debtGroupsView.length === 0 && (
                    <p className="text-xs text-zinc-500 text-center py-6">Nenhuma meta cadastrada ainda.</p>
                  )}
                  {debtGroupsView.map(section => {
                    const isCollapsed = !!collapsedGroups[section.id];
                    const isSectionDone = section.debts.length > 0 && section.completedCount === section.debts.length;
                    return (
                      <div key={section.id} className="space-y-2">
                        <button
                          onClick={() => toggleGroupCollapse(section.id)}
                          className="w-full flex items-center justify-between gap-2 bg-zinc-900/70 border border-zinc-800 rounded-xl px-3 py-2"
                        >
                          <div className="flex items-center gap-2 min-w-0">
                            <Icon name={isCollapsed ? "chevron-right" : "chevron-down"} size={14} className="text-zinc-500 shrink-0" />
                            <span className={`text-xs font-bold truncate ${section.isUngrouped ? "text-zinc-400" : "text-white"}`}>
                              {section.name}
                            </span>
                            {isSectionDone && (
                              <span className="text-[9px] bg-emerald-500 text-black font-extrabold px-1.5 py-0.2 rounded shrink-0">Concluído</span>
                            )}
                          </div>
                          <span className="text-[10px] text-zinc-400 shrink-0">
                            {section.completedCount}/{section.debts.length} • {section.percent}%
                          </span>
                        </button>

                        {!isCollapsed && (
                          <div className="space-y-2 pl-1">
                            <div className="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                              <div
                                className="bg-gradient-to-r from-amber-500 to-emerald-400 h-full transition-all duration-500"
                                style={{ width: `${section.percent}%` }}
                              ></div>
                            </div>
                            {section.debts.map(debt => {
                              const isPaid = debt.current >= debt.target;
                              return (
                                <div
                                  key={debt.id}
                                  className={`p-3 rounded-2xl border transition flex justify-between items-center ${
                                    isPaid ? "bg-emerald-950/20 border-emerald-500/30" : "bg-zinc-950 border-zinc-800"
                                  }`}
                                >
                                  <div>
                                    <div className="flex items-center gap-1.5">
                                      <span className={`text-xs font-bold ${isPaid ? "text-emerald-400 line-through" : "text-white"}`}>
                                        {debt.name}
                                      </span>
                                      {isPaid && <span className="text-[10px] bg-emerald-500 text-black font-extrabold px-1.5 py-0.2 rounded">Quitado</span>}
                                    </div>
                                    <span className="text-[11px] text-zinc-400">
                                      R$ {debt.current.toFixed(2)} de R$ {debt.target.toFixed(2)}
                                    </span>
                                  </div>

                                  <div className="flex items-center gap-1">
                                    {debt.current > 0 && (
                                      <button
                                        onClick={() => handleResetDebtPayment(debt.id)}
                                        className="p-1.5 text-zinc-500 hover:text-amber-400 transition"
                                        title="Zerar valor pago desta conta"
                                      >
                                        <Icon name="rotate-ccw" size={14} />
                                      </button>
                                    )}
                                    <button
                                      onClick={() => handleOpenEditDebt(debt)}
                                      className="p-1.5 text-zinc-400 hover:text-sky-400 transition"
                                      title="Editar meta"
                                    >
                                      <Icon name="pencil" size={14} />
                                    </button>
                                    <button
                                      onClick={() => handleDeleteDebt(debt.id)}
                                      className="p-1.5 text-zinc-400 hover:text-rose-400 transition"
                                      title="Excluir meta"
                                    >
                                      <Icon name="trash-2" size={14} />
                                    </button>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* MODAL: GRUPOS DE METAS */}
          {isGroupsModalOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl max-h-[85vh] flex flex-col">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-bold text-base text-white flex items-center gap-2">
                    <Icon name="layers" size={18} className="text-sky-400" /> Grupos de Metas
                  </h3>
                  <button
                    onClick={() => { setIsGroupsModalOpen(false); handleCancelEditGroup(); }}
                    className="text-zinc-400 hover:text-white"
                  >
                    <Icon name="x" size={20} />
                  </button>
                </div>

                <p className="text-[11px] text-zinc-400 mb-3">
                  Separe as metas em grupos menores. A ordem define a sequência: complete um grupo e siga para o próximo.
                </p>

                <form onSubmit={handleSaveGroup} className="flex items-center gap-2 mb-3">
                  <input
                    type="text"
                    required
                    placeholder="Nome do grupo"
                    value={groupForm.name}
                    onChange={e => setGroupForm({ name: e.target.value })}
                    className="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-sky-400"
                  />
                  <button
                    type="submit"
                    className="bg-sky-500 hover:bg-sky-600 text-black font-bold p-2.5 rounded-xl active:scale-95 transition shrink-0"
                    title={editingGroupId ? "Salvar" : "Adicionar"}
                  >
                    <Icon name={editingGroupId ? "check" : "plus"} size={16} />
                  </button>
                  {editingGroupId && (
                    <button
                      type="button"
                      onClick={handleCancelEditGroup}
                      className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 p-2.5 rounded-xl active:scale-95 transition shrink-0"
                      title="Cancelar"
                    >
                      <Icon name="x" size={16} />
                    </button>
                  )}
                </form>

                <div className="space-y-2 overflow-y-auto pr-1 flex-1">
                  {groups.length === 0 && (
                    <p className="text-xs text-zinc-500 text-center py-4">Nenhum grupo criado ainda.</p>
                  )}
                  {groups.map((group, idx) => (
                    <div
                      key={group.id}
                      className="bg-zinc-950 border border-zinc-800 p-2.5 rounded-xl flex items-center justify-between gap-2"
                    >
                      <div className="flex items-center gap-1">
                        <button
                          onClick={() => handleMoveGroup(group.id, -1)}
                          disabled={idx === 0}
                          className="p-1 text-zinc-500 hover:text-white disabled:opacity-20 disabled:hover:text-zinc-500 transition"
                          title="Mover para cima"
                        >
                          <Icon name="chevron-up" size={14} />
                        </button>
                        <button
                          onClick={() => handleMoveGroup(group.id, 1)}
                          disabled={idx === groups.length - 1}
                          className="p-1 text-zinc-500 hover:text-white disabled:opacity-20 disabled:hover:text-zinc-500 transition"
                          title="Mover para baixo"
                        >
                          <Icon name="chevron-down" size={14} />
                        </button>
                      </div>
                      <span className="text-xs font-bold text-white flex-1 truncate">{group.name}</span>
                      <span className="text-[10px] text-zinc-500 shrink-0">
                        {activeDebts.filter(d => d.groupId === group.id).length} metas
                      </span>
                      <button
                        onClick={() => handleOpenEditGroup(group)}
                        className="p-1.5 text-zinc-400 hover:text-sky-400 transition"
                        title="Editar grupo"
                      >
                        <Icon name="pencil" size={14} />
                      </button>
                      <button
                        onClick={() => handleDeleteGroup(group.id)}
                        className="p-1.5 text-zinc-400 hover:text-rose-400 transition"
                        title="Excluir grupo"
                      >
                        <Icon name="trash-2" size={14} />
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODAL: LIXEIRA DE METAS */}
          {isTrashModalOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl max-h-[85vh] flex flex-col">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-bold text-base text-white flex items-center gap-2">
                    <Icon name="trash-2" size={18} className="text-zinc-400" /> Lixeira
                  </h3>
                  <button onClick={() => setIsTrashModalOpen(false)} className="text-zinc-400 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>

                <p className="text-[11px] text-zinc-400 mb-3">
                  Metas apagadas ficam aqui até você restaurar ou excluir para sempre.
                </p>

                <div className="space-y-2 overflow-y-auto pr-1 flex-1">
                  {trashedDebts.length === 0 && (
                    <p className="text-xs text-zinc-500 text-center py-6">A lixeira está vazia.</p>
                  )}
                  {trashedDebts.map(debt => (
                    <div
                      key={debt.id}
                      className="bg-zinc-950 border border-zinc-800 p-3 rounded-2xl flex items-center justify-between gap-2"
                    >
                      <div className="min-w-0">
                        <span className="text-xs font-bold text-zinc-300 block truncate">{debt.name}</span>
                        <span className="text-[11px] text-zinc-500">
                          R$ {debt.current.toFixed(2)} de R$ {debt.target.toFixed(2)}
                        </span>
                      </div>
                      <div className="flex items-center gap-1 shrink-0">
                        <button
                          onClick={() => handleRestoreDebt(debt.id)}
                          className="p-1.5 text-zinc-400 hover:text-emerald-400 transition"
                          title="Restaurar meta"
                        >
                          <Icon name="rotate-ccw" size={14} />
                        </button>
                        <button
                          onClick={() => handlePermanentlyDeleteDebt(debt.id)}
                          className="p-1.5 text-zinc-400 hover:text-rose-400 transition"
                          title="Excluir para sempre"
                        >
                          <Icon name="trash-2" size={14} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                {trashedDebts.length > 0 && (
                  <button
                    onClick={handleEmptyTrash}
                    className="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 font-bold py-2 rounded-xl text-xs active:scale-95 transition mt-3"
                  >
                    Esvaziar Lixeira
                  </button>
                )}
              </div>
            </div>
          )}

          {/* MODAL: CRIAR OU EDITAR META */}
          {isDebtEditModalOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-bold text-base text-white">
                    {editingDebtId ? "Editar Meta" : "Nova Meta"}
                  </h3>
                  <button onClick={() => setIsDebtEditModalOpen(false)} className="text-zinc-400 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>
                <form onSubmit={handleSaveDebt} className="space-y-3">
                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Nome da Conta / Meta</label>
                    <input
                      type="text"
                      required
                      placeholder="Ex: Empréstimo do Banco"
                      value={debtForm.name}
                      onChange={e => setDebtForm({ ...debtForm, name: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-400"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Valor Total (R$)</label>
                    <input
                      type="number"
                      step="0.01"
                      required
                      placeholder="Ex: 600.00"
                      value={debtForm.target}
                      onChange={e => setDebtForm({ ...debtForm, target: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-400"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Grupo</label>
                    <select
                      value={debtForm.groupId}
                      onChange={e => setDebtForm({ ...debtForm, groupId: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-400 [color-scheme:dark]"
                    >
                      <option value="">Sem Grupo</option>
                      {groups.map(g => (
                        <option key={g.id} value={g.id}>{g.name}</option>
                      ))}
                    </select>
                  </div>
                  <button
                    type="submit"
                    className="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-2.5 rounded-xl active:scale-95 transition mt-2"
                  >
                    {editingDebtId ? "Salvar Alterações" : "Criar Meta"}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: GASTO EXTRA */}
          {isExpenseModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-bold text-base text-rose-400 flex items-center gap-2">
                    <Icon name="arrow-up-right" size={18} />
                    {editingExpenseId ? "Editar Gasto Extra" : "Novo Gasto Extra"}
                  </h3>
                  <button onClick={() => setIsExpenseModalOpen(false)} className="text-zinc-400 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>

                <form onSubmit={handleSaveExpense} className="space-y-3">
                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Data</label>
                    <input
                      type="date"
                      required
                      value={expenseForm.date}
                      onChange={e => setExpenseForm({ ...expenseForm, date: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-rose-400 [color-scheme:dark]"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Valor do Saque (R$)*</label>
                    <input
                      type="number"
                      step="0.01"
                      required
                      placeholder="Ex: 50.00"
                      value={expenseForm.amount}
                      onChange={e => setExpenseForm({ ...expenseForm, amount: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-rose-400"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Descrição</label>
                    <input
                      type="text"
                      placeholder="Ex: Almoço, lanche, uso pessoal"
                      value={expenseForm.description}
                      onChange={e => setExpenseForm({ ...expenseForm, description: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-rose-400"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-2.5 rounded-xl active:scale-95 transition mt-2"
                  >
                    {editingExpenseId ? "Salvar Alterações" : "Confirmar Saque"}
                  </button>

                  {editingExpenseId && (
                    <button
                      type="button"
                      onClick={() => handleDeleteExpense(editingExpenseId)}
                      className="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 font-bold py-2 rounded-xl text-xs active:scale-95 transition mt-2"
                    >
                      Excluir Gasto (Estornar Saldo)
                    </button>
                  )}
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
