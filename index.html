<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rota da Liberdade - Gamificação das Entregas</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons & Canvas Confetti -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #000000;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
    }
    .asphalt-line {
      background: repeating-linear-gradient(
        to bottom,
        #facc15 0px,
        #facc15 14px,
        transparent 14px,
        transparent 28px
      );
    }
  </style>
</head>
<body class="antialiased pb-28">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const getTodayLocalDate = () => {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().split("T")[0];
    };

    const formatHoursMinutes = (decimalHours) => {
      if (!decimalHours || decimalHours <= 0) return "0 h 0 m";
      const totalMinutes = Math.round(decimalHours * 60);
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      return `${h} h ${m} m`;
    };

    const Icon = ({ name, size = 20, className = "" }) => {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
    };

    const initialDebtsList = [
      { id: 101, name: "Luz (Terreiro)", target: 285.00, current: 0 },
      { id: 102, name: "Água (Terreiro)", target: 120.00, current: 0 },
      { id: 103, name: "Claro (Terreiro)", target: 240.00, current: 0 },
      { id: 104, name: "Alarme (Terreiro)", target: 400.00, current: 0 },
      { id: 105, name: "Aluguel (Terreiro)", target: 1000.00, current: 0 },
      { id: 106, name: "Fernanda", target: 1200.00, current: 0 },
      { id: 107, name: "Tassiana", target: 760.00, current: 0 },
      { id: 108, name: "Everson", target: 1200.00, current: 0 },
      { id: 109, name: "Facio", target: 497.84, current: 0 },
      { id: 110, name: "Bitpay / Bepay", target: 232.98, current: 0 },
      { id: 111, name: "iFood", target: 380.49, current: 0 },
      { id: 112, name: "Infinity", target: 353.73, current: 0 },
      { id: 113, name: "Inter", target: 300.49, current: 0 },
      { id: 201, name: "Luz (Casa)", target: 380.00, current: 0 },
      { id: 202, name: "Gás (Casa)", target: 200.00, current: 0 },
      { id: 203, name: "Claro (Casa)", target: 155.00, current: 0 },
      { id: 204, name: "Vivo", target: 190.00, current: 0 },
      { id: 205, name: "Psico", target: 450.00, current: 0 },
      { id: 206, name: "Psiq", target: 150.00, current: 0 },
      { id: 207, name: "Ração", target: 330.00, current: 0 },
      { id: 208, name: "Petlove", target: 460.00, current: 0 },
      { id: 209, name: "Unha", target: 160.00, current: 0 },
      { id: 210, name: "Murilo / Muilo", target: 120.00, current: 0 },
      { id: 211, name: "Cloud", target: 67.00, current: 0 },
      { id: 212, name: "Claude", target: 110.00, current: 0 },
      { id: 213, name: "BB", target: 57.00, current: 0 },
      { id: 214, name: "Delicato", target: 400.00, current: 0 },
      { id: 215, name: "Gympass", target: 350.00, current: 0 },
      { id: 216, name: "Gabriella / Gabrilla", target: 426.00, current: 0 },
      { id: 217, name: "Stephanie", target: 500.00, current: 0 },
      { id: 218, name: "Ferragem", target: 353.00, current: 0 },
    ];

    function App() {
      const [wallet, setWallet] = useState(() => {
        const saved = localStorage.getItem("rota_wallet");
        return saved ? JSON.parse(saved) : 0;
      });

      const [shifts, setShifts] = useState(() => {
        const saved = localStorage.getItem("rota_shifts");
        return saved ? JSON.parse(saved) : [];
      });

      const [expenses, setExpenses] = useState(() => {
        const saved = localStorage.getItem("rota_expenses");
        return saved ? JSON.parse(saved) : [];
      });

      const [debts, setDebts] = useState(() => {
        const saved = localStorage.getItem("rota_debts_v2");
        return saved ? JSON.parse(saved) : initialDebtsList;
      });

      const [weeklyGoal, setWeeklyGoal] = useState(() => {
        const saved = localStorage.getItem("rota_goal");
        return saved ? parseFloat(saved) : 800;
      });

      const [weekOffset, setWeekOffset] = useState(0);
      const [selectedDayIndex, setSelectedDayIndex] = useState(null);

      // Modais
      const [isShiftModalOpen, setIsShiftModalOpen] = useState(false);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      const [isPayModalOpen, setIsPayModalOpen] = useState(false);
      const [isNewDebtModalOpen, setIsNewDebtModalOpen] = useState(false);
      const [selectedDebt, setSelectedDebt] = useState(null);
      const [payAmount, setPayAmount] = useState("");

      // Estados de Edição
      const [editingShiftId, setEditingShiftId] = useState(null);
      const [editingExpenseId, setEditingExpenseId] = useState(null);

      const [shiftForm, setShiftForm] = useState({
        date: getTodayLocalDate(),
        income: "",
        hours: "",
        km: "",
        trips: "",
      });

      const [expenseForm, setExpenseForm] = useState({
        amount: "",
        description: "",
        date: getTodayLocalDate(),
      });

      const [newDebtForm, setNewDebtForm] = useState({ name: "", target: "" });

      useEffect(() => {
        localStorage.setItem("rota_wallet", JSON.stringify(wallet));
        localStorage.setItem("rota_shifts", JSON.stringify(shifts));
        localStorage.setItem("rota_expenses", JSON.stringify(expenses));
        localStorage.setItem("rota_debts_v2", JSON.stringify(debts));
        localStorage.setItem("rota_goal", weeklyGoal.toString());
        if (window.lucide) window.lucide.createIcons();
      }, [wallet, shifts, expenses, debts, weeklyGoal]);

      // Montagem da Semana Selecionada
      const weekData = useMemo(() => {
        const now = new Date();
        const currentDay = now.getDay() === 0 ? 7 : now.getDay();

        const monday = new Date(now);
        monday.setDate(now.getDate() - (currentDay - 1) + weekOffset * 7);
        monday.setHours(0, 0, 0, 0);

        const days = [];
        const dayNames = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];
        const monthNames = ["jan.", "fev.", "mar.", "abr.", "mai.", "jun.", "jul.", "ago.", "set.", "out.", "nov.", "dez."];

        for (let i = 0; i < 7; i++) {
          const d = new Date(monday);
          d.setDate(monday.getDate() + i);
          
          const localISO = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split("T")[0];
          const dayShifts = shifts.filter(s => s.date === localISO);
          const dayExpenses = expenses.filter(e => e.date === localISO);

          const income = dayShifts.reduce((acc, s) => acc + s.income, 0);
          const hours = dayShifts.reduce((acc, s) => acc + s.hours, 0);
          const km = dayShifts.reduce((acc, s) => acc + s.km, 0);
          const trips = dayShifts.reduce((acc, s) => acc + s.trips, 0);

          days.push({
            dateStr: localISO,
            dayNum: d.getDate(),
            monthName: monthNames[d.getMonth()],
            dayName: dayNames[i],
            income,
            hours,
            km,
            trips,
            shiftsList: dayShifts,
            expensesList: dayExpenses,
            hasWork: dayShifts.length > 0
          });
        }

        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);

        const dateRangeLabel = `${monday.getDate()} de ${monthNames[monday.getMonth()]} – ${sunday.getDate()} de ${monthNames[sunday.getMonth()]}`;

        const totalIncome = days.reduce((acc, d) => acc + d.income, 0);
        const totalHours = days.reduce((acc, d) => acc + d.hours, 0);
        const totalKm = days.reduce((acc, d) => acc + d.km, 0);
        const totalTrips = days.reduce((acc, d) => acc + d.trips, 0);

        const startISO = new Date(monday.getTime() - monday.getTimezoneOffset() * 60000).toISOString().split("T")[0];
        const endISO = new Date(sunday.getTime() - sunday.getTimezoneOffset() * 60000).toISOString().split("T")[0];
        const weekExpenses = expenses.filter(e => e.date >= startISO && e.date <= endISO);

        const maxDailyIncome = Math.max(...days.map(d => d.income), 0);

        return {
          days,
          dateRangeLabel,
          totalIncome,
          totalHours,
          totalKm,
          totalTrips,
          weekExpenses,
          maxDailyIncome,
        };
      }, [shifts, expenses, weekOffset]);

      const debtTotals = useMemo(() => {
        const totalTarget = debts.reduce((acc, d) => acc + d.target, 0);
        const totalPaid = debts.reduce((acc, d) => acc + d.current, 0);
        const allCompleted = debts.length > 0 && debts.every(d => d.current >= d.target);
        const percent = totalTarget > 0 ? Math.round((totalPaid / totalTarget) * 100) : 100;
        return { totalTarget, totalPaid, allCompleted, percent };
      }, [debts]);

      const activeStats = useMemo(() => {
        if (selectedDayIndex !== null && weekData.days[selectedDayIndex]) {
          const d = weekData.days[selectedDayIndex];
          return {
            title: `${d.dayNum} de ${d.monthName} (${d.dayName})`,
            income: d.income,
            hours: d.hours,
            trips: d.trips,
            km: d.km,
            shiftsList: d.shiftsList,
            expensesList: d.expensesList,
            isSingleDay: true
          };
        }
        return {
          title: "Total da Semana",
          income: weekData.totalIncome,
          hours: weekData.totalHours,
          trips: weekData.totalTrips,
          km: weekData.totalKm,
          shiftsList: [],
          expensesList: weekData.weekExpenses,
          isSingleDay: false
        };
      }, [selectedDayIndex, weekData]);

      // Turnos: Salvar, Editar e Deletar
      const handleSaveShift = (e) => {
        e.preventDefault();
        const income = parseFloat(shiftForm.income) || 0;
        const hours = parseFloat(shiftForm.hours) || 0;
        const km = parseFloat(shiftForm.km) || 0;
        const trips = parseInt(shiftForm.trips) || 0;

        if (income <= 0) return;

        if (editingShiftId) {
          const oldShift = shifts.find(s => s.id === editingShiftId);
          const incomeDifference = income - (oldShift ? oldShift.income : 0);

          setShifts(prev => prev.map(s => {
            if (s.id === editingShiftId) {
              return { ...s, date: shiftForm.date, income, hours, km, trips };
            }
            return s;
          }));

          setWallet(prev => Math.max(0, prev + incomeDifference));
        } else {
          const newShift = {
            id: Date.now(),
            date: shiftForm.date,
            income,
            hours,
            km,
            trips,
          };
          setShifts([newShift, ...shifts]);
          setWallet(prev => prev + income);
        }

        setIsShiftModalOpen(false);
        setEditingShiftId(null);
        setShiftForm({
          date: getTodayLocalDate(),
          income: "",
          hours: "",
          km: "",
          trips: "",
        });
      };

      const handleOpenEditShift = (shift) => {
        setEditingShiftId(shift.id);
        setShiftForm({
          date: shift.date,
          income: shift.income.toString(),
          hours: shift.hours ? shift.hours.toString() : "",
          km: shift.km ? shift.km.toString() : "",
          trips: shift.trips ? shift.trips.toString() : "",
        });
        setIsShiftModalOpen(true);
      };

      const handleDeleteShift = (id) => {
        if (!confirm("Tem certeza que deseja excluir esse lançamento de turno?")) return;
        const shiftToDelete = shifts.find(s => s.id === id);
        if (!shiftToDelete) return;

        setShifts(prev => prev.filter(s => s.id !== id));
        setWallet(prev => Math.max(0, prev - shiftToDelete.income));
        setIsShiftModalOpen(false);
        setEditingShiftId(null);
      };

      // Gastos Extras: Salvar, Editar e Deletar
      const handleSaveExpense = (e) => {
        e.preventDefault();
        const amount = parseFloat(expenseForm.amount) || 0;
        if (amount <= 0) return;

        if (editingExpenseId) {
          const oldExpense = expenses.find(exp => exp.id === editingExpenseId);
          const oldAmount = oldExpense ? oldExpense.amount : 0;
          const diff = amount - oldAmount; // Se aumentou o gasto, reduz mais da carteira

          if (diff > wallet) {
            alert("Saldo insuficiente na carteira para esse aumento de gasto!");
            return;
          }

          setExpenses(prev => prev.map(exp => {
            if (exp.id === editingExpenseId) {
              return { ...exp, date: expenseForm.date, amount, description: expenseForm.description || "Gasto Extra" };
            }
            return exp;
          }));

          setWallet(prev => prev - diff);
        } else {
          if (amount > wallet) {
            alert("Saldo insuficiente na carteira!");
            return;
          }

          setExpenses([{
            id: Date.now(),
            amount,
            description: expenseForm.description || "Gasto Extra",
            date: expenseForm.date,
          }, ...expenses]);

          setWallet(prev => prev - amount);
        }

        setIsExpenseModalOpen(false);
        setEditingExpenseId(null);
        setExpenseForm({
          amount: "",
          description: "",
          date: getTodayLocalDate(),
        });
      };

      const handleOpenEditExpense = (expense) => {
        setEditingExpenseId(expense.id);
        setExpenseForm({
          date: expense.date,
          amount: expense.amount.toString(),
          description: expense.description || "",
        });
        setIsExpenseModalOpen(true);
      };

      const handleDeleteExpense = (id) => {
        if (!confirm("Deseja apagar esse gasto extra? O valor será estornado de volta para a carteira.")) return;
        const expToDelete = expenses.find(exp => exp.id === id);
        if (!expToDelete) return;

        setExpenses(prev => prev.filter(exp => exp.id !== id));
        setWallet(prev => prev + expToDelete.amount); // Devolve o valor à carteira
        setIsExpenseModalOpen(false);
        setEditingExpenseId(null);
      };

      // Abater Metas
      const handlePayDebt = (e) => {
        e.preventDefault();
        const amt = parseFloat(payAmount) || 0;
        if (amt <= 0 || amt > wallet || !selectedDebt) return;

        const needed = selectedDebt.target - selectedDebt.current;
        const actualPay = Math.min(amt, needed);

        setDebts(prev =>
          prev.map(d => {
            if (d.id === selectedDebt.id) {
              const updated = d.current + actualPay;
              if (updated >= d.target && window.confetti) {
                window.confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
              }
              return { ...d, current: updated };
            }
            return d;
          })
        );

        setWallet(prev => prev - actualPay);
        setIsPayModalOpen(false);
        setPayAmount("");
        setSelectedDebt(null);
      };

      const handleDeleteDebt = (id) => {
        if (!confirm("Deseja realmente apagar esta meta da lista?")) return;
        setDebts(prev => prev.filter(d => d.id !== id));
      };

      const handleAddDebt = (e) => {
        e.preventDefault();
        const target = parseFloat(newDebtForm.target) || 0;
        if (!newDebtForm.name || target <= 0) return;

        setDebts([...debts, { id: Date.now(), name: newDebtForm.name, target, current: 0 }]);
        setNewDebtForm({ name: "", target: "" });
        setIsNewDebtModalOpen(false);
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-black text-white p-4 space-y-6">
          
          {/* TOPO: Carteira & Ações Rápidas */}
          <header className="bg-zinc-950 border border-zinc-800/80 p-4 rounded-2xl">
            <div className="flex justify-between items-center mb-3">
              <div>
                <span className="text-[11px] text-zinc-400 font-semibold uppercase tracking-wider">Saldo na Carteira</span>
                <div className="text-2xl font-extrabold text-amber-400">
                  R$ {wallet.toFixed(2)}
                </div>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-2">
              <button
                onClick={() => {
                  setEditingShiftId(null);
                  setShiftForm({
                    date: getTodayLocalDate(),
                    income: "",
                    hours: "",
                    km: "",
                    trips: "",
                  });
                  setIsShiftModalOpen(true);
                }}
                className="bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 text-xs active:scale-95 transition"
              >
                <Icon name="plus-circle" size={16} />
                <span>+ Diária</span>
              </button>

              <button
                onClick={() => {
                  setEditingExpenseId(null);
                  setExpenseForm({
                    amount: "",
                    description: "",
                    date: getTodayLocalDate(),
                  });
                  setIsExpenseModalOpen(true);
                }}
                disabled={wallet <= 0}
                className={`py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 text-xs font-bold transition ${
                  wallet > 0
                    ? "bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 border border-rose-500/30 active:scale-95"
                    : "bg-zinc-900 text-zinc-600 cursor-not-allowed border border-zinc-900"
                }`}
              >
                <Icon name="arrow-up-right" size={16} />
                <span>- Gasto Extra</span>
              </button>
            </div>
          </header>

          {/* PAINEL SEMANAL UBER */}
          <section className="bg-zinc-950 border border-zinc-800/80 rounded-2xl p-5 relative">
            <div className="flex items-center justify-between text-zinc-300 mb-6">
              <button
                onClick={() => {
                  setWeekOffset(prev => prev - 1);
                  setSelectedDayIndex(null);
                }}
                className="p-1 text-zinc-400 hover:text-white active:scale-90 transition"
              >
                <Icon name="chevron-left" size={22} />
              </button>

              <div className="text-sm font-semibold tracking-wide flex items-center gap-1 text-zinc-200">
                {weekData.dateRangeLabel}
                {weekOffset === 0 && <span className="text-[10px] bg-zinc-800 text-zinc-400 px-1.5 py-0.5 rounded font-normal ml-1">Atual</span>}
              </div>

              <button
                onClick={() => {
                  setWeekOffset(prev => prev + 1);
                  setSelectedDayIndex(null);
                }}
                className="p-1 text-zinc-400 hover:text-white active:scale-90 transition"
              >
                <Icon name="chevron-right" size={22} />
              </button>
            </div>

            <div className="text-center mb-6">
              {selectedDayIndex !== null && (
                <button
                  onClick={() => setSelectedDayIndex(null)}
                  className="text-[11px] text-sky-400 mb-1 inline-flex items-center gap-1 hover:underline"
                >
                  <Icon name="rotate-ccw" size={12} /> Ver total da semana
                </button>
              )}
              <div className="text-3xl font-extrabold tracking-tight">
                R$ {activeStats.income.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
              </div>
              <p className="text-xs text-zinc-400 mt-0.5">{activeStats.title}</p>
            </div>

            <div className="text-right text-[11px] text-zinc-400 mb-1 pr-1 font-medium">
              {weekData.maxDailyIncome > 0 && `R$ ${weekData.maxDailyIncome.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`}
            </div>

            <div className="relative pt-4 pb-2 border-b border-dashed border-zinc-700">
              <div className="h-36 flex items-end justify-between gap-1.5 px-1">
                {weekData.days.map((day, idx) => {
                  const isSelected = selectedDayIndex === idx;
                  const isZero = day.income === 0;
                  const heightPercent = weekData.maxDailyIncome > 0 ? (day.income / weekData.maxDailyIncome) * 100 : 0;

                  return (
                    <div
                      key={day.dateStr}
                      onClick={() => setSelectedDayIndex(isSelected ? null : idx)}
                      className="flex-1 h-full flex flex-col justify-end items-center cursor-pointer group"
                    >
                      <div
                        style={{ height: isZero ? "4px" : `${Math.max(8, heightPercent)}%` }}
                        className={`w-full rounded-t-sm transition-all duration-200 ${
                          isSelected
                            ? "bg-sky-400"
                            : isZero
                            ? "bg-zinc-800 group-hover:bg-zinc-700"
                            : "bg-sky-600 group-hover:bg-sky-500"
                        }`}
                      ></div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="flex justify-between items-center text-center mt-3 px-1 text-xs">
              {weekData.days.map((day, idx) => {
                const isSelected = selectedDayIndex === idx;
                return (
                  <div
                    key={day.dateStr}
                    onClick={() => setSelectedDayIndex(isSelected ? null : idx)}
                    className={`flex-1 cursor-pointer transition py-1 rounded-lg ${
                      isSelected ? "text-sky-400 font-bold bg-sky-950/30" : "text-zinc-400 hover:text-white"
                    }`}
                  >
                    <div className="text-[13px]">{day.dayNum}</div>
                    <div className="text-[11px] font-medium">{day.dayName}</div>
                  </div>
                );
              })}
            </div>

            {/* Estatísticas de Trabalho */}
            <div className="mt-8 pt-4 border-t border-zinc-900">
              <div className="flex justify-between items-center mb-4">
                <h4 className="text-lg font-bold tracking-tight">Estatísticas</h4>

                {activeStats.isSingleDay && activeStats.shiftsList && activeStats.shiftsList.length > 0 && (
                  <button
                    onClick={() => handleOpenEditShift(activeStats.shiftsList[0])}
                    className="text-xs bg-zinc-800 hover:bg-zinc-700 text-sky-400 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition border border-zinc-700"
                  >
                    <Icon name="pencil" size={13} />
                    <span>Editar Turno</span>
                  </button>
                )}
              </div>

              <div className="grid grid-cols-3 gap-2">
                <div>
                  <span className="text-xs text-zinc-400 block mb-1">Online</span>
                  <span className="text-base font-extrabold text-white">
                    {formatHoursMinutes(activeStats.hours)}
                  </span>
                </div>
                <div>
                  <span className="text-xs text-zinc-400 block mb-1">Viagens</span>
                  <span className="text-base font-extrabold text-white">
                    {activeStats.trips}
                  </span>
                </div>
                <div>
                  <span className="text-xs text-zinc-400 block mb-1">Distância</span>
                  <span className="text-base font-extrabold text-white">
                    {activeStats.km} km
                  </span>
                </div>
              </div>
            </div>

            {/* SEÇÃO DE GASTOS EXTRAS DO PERÍODO COM BOTÃO EDITAR/DELETAR */}
            {activeStats.expensesList && activeStats.expensesList.length > 0 && (
              <div className="mt-6 pt-4 border-t border-zinc-900">
                <span className="text-xs font-bold text-rose-400 uppercase tracking-wider block mb-2 flex items-center gap-1">
                  <Icon name="receipt" size={14} /> Gastos Extras do Período
                </span>
                <div className="space-y-2">
                  {activeStats.expensesList.map(exp => (
                    <div
                      key={exp.id}
                      className="bg-zinc-900 border border-zinc-800/80 p-2.5 rounded-xl flex justify-between items-center"
                    >
                      <div>
                        <span className="text-xs font-bold text-zinc-200 block">{exp.description}</span>
                        <span className="text-[10px] text-zinc-500">{exp.date}</span>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="text-xs font-extrabold text-rose-400">
                          - R$ {exp.amount.toFixed(2)}
                        </span>
                        <button
                          onClick={() => handleOpenEditExpense(exp)}
                          className="text-zinc-500 hover:text-sky-400 p-1 transition"
                          title="Editar gasto extra"
                        >
                          <Icon name="pencil" size={13} />
                        </button>
                        <button
                          onClick={() => handleDeleteExpense(exp.id)}
                          className="text-zinc-500 hover:text-rose-400 p-1 transition"
                          title="Excluir gasto e estornar valor"
                        >
                          <Icon name="trash-2" size={13} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </section>

          {/* TRILHA DO ASFALTO */}
          <section className="bg-zinc-950 border border-zinc-800/80 p-4 rounded-2xl">
            <div className="flex justify-between items-center mb-6">
              <div>
                <h2 className="font-extrabold text-base text-white flex items-center gap-2">
                  <Icon name="map-pin" size={18} className="text-amber-400" /> A Trilha da Liberdade
                </h2>
                <p className="text-xs text-zinc-400">
                  {debtTotals.percent}% pago (R$ {debtTotals.totalPaid.toFixed(2)} de R$ {debtTotals.totalTarget.toFixed(2)})
                </p>
              </div>
              <button
                onClick={() => setIsNewDebtModalOpen(true)}
                className="text-xs text-zinc-400 hover:text-white bg-zinc-900 px-2.5 py-1.5 rounded-lg flex items-center gap-1 border border-zinc-800"
              >
                <Icon name="plus" size={14} /> Meta
              </button>
            </div>

            <div className="relative pl-6 space-y-5 my-4">
              <div className="absolute left-[31px] top-4 bottom-4 w-1 asphalt-line -translate-x-1/2"></div>

              {debts.map((debt, index) => {
                const isPaid = debt.current >= debt.target;
                const inProgress = debt.current > 0 && !isPaid;

                return (
                  <div key={debt.id} className="relative flex items-center gap-4">
                    <div
                      className={`z-10 w-9 h-9 rounded-full flex items-center justify-center font-bold text-xs border-2 shadow-lg transition-all flex-shrink-0 ${
                        isPaid
                          ? "bg-emerald-500 border-emerald-400 text-black shadow-emerald-500/20"
                          : inProgress
                          ? "bg-amber-400 border-yellow-300 text-black"
                          : "bg-zinc-900 border-zinc-700 text-zinc-300"
                      }`}
                    >
                      {isPaid ? (
                        <Icon name="check" size={18} />
                      ) : inProgress ? (
                        <Icon name="bike" size={18} />
                      ) : (
                        <Icon name="circle-dot" size={15} />
                      )}
                    </div>

                    <div className="flex-1 bg-zinc-900 border border-zinc-800 p-3.5 rounded-xl hover:border-zinc-700 transition">
                      <div className="flex justify-between items-start mb-1">
                        <div>
                          <span className="font-bold text-sm text-zinc-200 block">{debt.name}</span>
                          <span className="text-[10px] text-zinc-400">
                            Resta: R$ {(debt.target - debt.current).toFixed(2)}
                          </span>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className={`text-xs font-semibold ${isPaid ? "text-emerald-400" : "text-zinc-400"}`}>
                            R$ {debt.current.toFixed(0)} / {debt.target.toFixed(0)}
                          </span>
                          <button
                            onClick={() => handleDeleteDebt(debt.id)}
                            className="text-zinc-600 hover:text-rose-400 p-1"
                            title="Remover meta"
                          >
                            <Icon name="trash-2" size={14} />
                          </button>
                        </div>
                      </div>

                      <div className="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden my-2">
                        <div
                          className={`h-full transition-all duration-300 ${isPaid ? "bg-emerald-400" : "bg-amber-400"}`}
                          style={{ width: `${Math.min(100, (debt.current / debt.target) * 100)}%` }}
                        ></div>
                      </div>

                      {!isPaid ? (
                        <button
                          onClick={() => {
                            setSelectedDebt(debt);
                            setIsPayModalOpen(true);
                          }}
                          disabled={wallet <= 0}
                          className={`w-full text-xs font-bold py-1.5 rounded-lg mt-1 transition flex items-center justify-center gap-1 ${
                            wallet > 0
                              ? "bg-amber-400 hover:bg-amber-300 text-black shadow active:scale-95"
                              : "bg-zinc-800 text-zinc-600 cursor-not-allowed"
                          }`}
                        >
                          <Icon name="coins" size={13} />
                          <span>{wallet > 0 ? "Pagar com Saldo" : "Sem saldo para abater"}</span>
                        </button>
                      ) : (
                        <div className="text-[11px] text-emerald-400 font-semibold flex items-center gap-1 mt-1 justify-center">
                          <Icon name="check-circle" size={12} /> Meta Quitada!
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* FASE 2: Carro Próprio */}
            <div className={`mt-8 p-4 rounded-xl border-2 border-dashed text-center transition ${
              debtTotals.allCompleted
                ? "bg-emerald-950/40 border-emerald-500 text-emerald-300"
                : "bg-zinc-950/40 border-zinc-800 text-zinc-600"
            }`}>
              <div className="flex justify-center mb-1">
                <Icon name="car" size={26} />
              </div>
              <h3 className="font-extrabold text-sm uppercase">Fase 2: Rota do Carro Próprio</h3>
              <p className="text-xs mt-0.5">
                {debtTotals.allCompleted
                  ? "🎉 PARABÉNS! Dívidas zeradas! A Trilha da Entrada do Carro está liberada!"
                  : "🔒 Bloqueado: Quite todas as metas cadastradas para destravar a rota da entrada do carro."}
              </p>
            </div>
          </section>

          {/* MODAL: Diária */}
          {isShiftModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-base text-white flex items-center gap-2">
                    <Icon name="bike" size={18} className="text-amber-400" />
                    {editingShiftId ? "Editar Turno" : "Registrar Turno"}
                  </h3>
                  <button onClick={() => setIsShiftModalOpen(false)} className="text-zinc-400 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>

                <form onSubmit={handleSaveShift} className="space-y-3">
                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Data do Turno</label>
                    <input
                      type="date"
                      required
                      value={shiftForm.date}
                      onChange={e => setShiftForm({ ...shiftForm, date: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-400 [color-scheme:dark]"
                    />
                  </div>

                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Faturamento Líquido (R$)*</label>
                    <input
                      type="number"
                      step="0.01"
                      required
                      placeholder="Ex: 145.50"
                      value={shiftForm.income}
                      onChange={e => setShiftForm({ ...shiftForm, income: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-400"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[11px] text-zinc-400 block mb-1">Horas na Pista</label>
                      <input
                        type="number"
                        step="0.01"
                        placeholder="Ex: 6.5"
                        value={shiftForm.hours}
                        onChange={e => setShiftForm({ ...shiftForm, hours: e.target.value })}
                        className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-400"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-zinc-400 block mb-1">Km Rodados</label>
                      <input
                        type="number"
                        step="1"
                        placeholder="Ex: 95"
                        value={shiftForm.km}
                        onChange={e => setShiftForm({ ...shiftForm, km: e.target.value })}
                        className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-400"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Qtd. de Viagens</label>
                    <input
                      type="number"
                      placeholder="Ex: 14"
                      value={shiftForm.trips}
                      onChange={e => setShiftForm({ ...shiftForm, trips: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-400"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-2.5 rounded-xl mt-2 active:scale-95 transition"
                  >
                    {editingShiftId ? "Salvar Alterações" : "Salvar na Carteira"}
                  </button>

                  {editingShiftId && (
                    <button
                      type="button"
                      onClick={() => handleDeleteShift(editingShiftId)}
                      className="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 font-bold py-2 rounded-xl text-xs active:scale-95 transition mt-2"
                    >
                      Excluir Turno
                    </button>
                  )}
                </form>
              </div>
            </div>
          )}

          {/* MODAL: Gasto Extra (Criar / Editar / Excluir) */}
          {isExpenseModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-bold text-base text-rose-400 flex items-center gap-2">
                    <Icon name="arrow-up-right" size={18} />
                    {editingExpenseId ? "Editar Gasto Extra" : "Novo Gasto Extra"}
                  </h3>
                  <button onClick={() => setIsExpenseModalOpen(false)} className="text-zinc-400 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>

                <form onSubmit={handleSaveExpense} className="space-y-3">
                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Data</label>
                    <input
                      type="date"
                      required
                      value={expenseForm.date}
                      onChange={e => setExpenseForm({ ...expenseForm, date: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-rose-400 [color-scheme:dark]"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Valor do Saque (R$)*</label>
                    <input
                      type="number"
                      step="0.01"
                      required
                      placeholder="Ex: 50.00"
                      value={expenseForm.amount}
                      onChange={e => setExpenseForm({ ...expenseForm, amount: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-rose-400"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Descrição</label>
                    <input
                      type="text"
                      placeholder="Ex: Almoço, lanche, uso pessoal"
                      value={expenseForm.description}
                      onChange={e => setExpenseForm({ ...expenseForm, description: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-rose-400"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-2.5 rounded-xl active:scale-95 transition mt-2"
                  >
                    {editingExpenseId ? "Salvar Alterações" : "Confirmar Saque"}
                  </button>

                  {editingExpenseId && (
                    <button
                      type="button"
                      onClick={() => handleDeleteExpense(editingExpenseId)}
                      className="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 font-bold py-2 rounded-xl text-xs active:scale-95 transition mt-2"
                    >
                      Excluir Gasto (Estornar Saldo)
                    </button>
                  )}
                </form>
              </div>
            </div>
          )}

          {/* MODAL: Abater Meta */}
          {isPayModalOpen && selectedDebt && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-bold text-base text-white">Abater Meta</h3>
                  <button onClick={() => setIsPayModalOpen(false)} className="text-zinc-400 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>
                <p className="text-xs text-zinc-400 mb-3">
                  Saldo: <strong>R$ {wallet.toFixed(2)}</strong>. Quanto abater em <strong>{selectedDebt.name}</strong>?
                </p>
                <form onSubmit={handlePayDebt} className="space-y-3">
                  <input
                    type="number"
                    step="0.01"
                    max={wallet}
                    placeholder={`Máx: R$ ${(selectedDebt.target - selectedDebt.current).toFixed(2)}`}
                    value={payAmount}
                    onChange={e => setPayAmount(e.target.value)}
                    className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-400"
                  />
                  <button
                    type="button"
                    onClick={() => setPayAmount(Math.min(wallet, selectedDebt.target - selectedDebt.current).toString())}
                    className="bg-zinc-800 hover:bg-zinc-700 text-xs px-2.5 py-1.5 rounded-lg border border-zinc-700 text-zinc-300"
                  >
                    Usar Máximo Possível
                  </button>
                  <button
                    type="submit"
                    className="w-full bg-amber-400 hover:bg-amber-300 text-black font-bold py-2.5 rounded-xl active:scale-95 transition"
                  >
                    Confirmar Pagamento
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: Nova Meta */}
          {isNewDebtModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-bold text-base text-white">Nova Meta</h3>
                  <button onClick={() => setIsNewDebtModalOpen(false)} className="text-zinc-400 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>
                <form onSubmit={handleAddDebt} className="space-y-3">
                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Nome da Conta</label>
                    <input
                      type="text"
                      required
                      placeholder="Ex: Empréstimo do Banco"
                      value={newDebtForm.name}
                      onChange={e => setNewDebtForm({ ...newDebtForm, name: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-400"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Valor Total (R$)</label>
                    <input
                      type="number"
                      step="0.01"
                      required
                      placeholder="Ex: 600.00"
                      value={newDebtForm.target}
                      onChange={e => setNewDebtForm({ ...newDebtForm, target: e.target.value })}
                      className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-400"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-2.5 rounded-xl active:scale-95 transition"
                  >
                    Inserir na Trilha
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
